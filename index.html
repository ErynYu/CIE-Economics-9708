/* ===== Built-in bank · flashcards (English) ===== */
const BUILTIN_CARD = [
{id:'c01',type:'card',ch:'1.1',t:'Definition',front:'Scarcity',back:'The situation in which wants are unlimited but the resources available to satisfy them are limited, so choices must be made.',note:'Relative concept; not the same as a temporary shortage.'},
{id:'c02',type:'card',ch:'1.1',t:'Definition',front:'Opportunity cost',back:'The value of the next best alternative forgone when a choice is made.',note:'Only the next best alternative; sunk costs are excluded.'},
{id:'c03',type:'card',ch:'1.1',t:'Definition',front:'Sunk cost',back:'A cost already incurred that cannot be recovered and therefore should not affect current decisions.',note:'Use it to explain why tuition fees are excluded.'},
{id:'c04',type:'card',ch:'1.2',t:'Definition',front:'Ceteris paribus',back:'A modelling assumption that all other variables are held constant so that the effect of one variable can be isolated.',note:'Limits the scope of a model conclusion.'},
{id:'c05',type:'card',ch:'1.2',t:'Definition',front:'Normative statement',back:'A statement containing a value judgement about what ought to be, which cannot be tested with data.',note:'Signals: should, ought, fair, better.'},
{id:'c06',type:'card',ch:'1.2',t:'Definition',front:'Positive statement',back:'A statement about what is, which can be tested against evidence.',note:'Can be confirmed or refuted by data.'},
{id:'c07',type:'card',ch:'1.3',t:'Definition',front:'Factors of production',back:'Land, labour, capital and enterprise, the inputs used to produce goods and services.',note:'Rewards: rent, wages, interest, profit.'},
{id:'c08',type:'card',ch:'1.3',t:'Definition',front:'Human capital',back:'The skills, knowledge and health of workers that raise their productivity, created mainly by education and training.',note:'A quality of labour.'},
{id:'c09',type:'card',ch:'1.3',t:'Definition',front:'Division of labour',back:'Breaking production into specialised tasks carried out by different workers in order to raise output per worker.',note:'Raises efficiency but increases dependence and monotony.'},
{id:'c10',type:'card',ch:'1.4',t:'Definition',front:'Price mechanism',back:'The system by which prices signal scarcity, ration scarce goods and provide incentives to producers and consumers.',note:'Three functions: signalling, rationing, incentive.'},
{id:'c11',type:'card',ch:'1.4',t:'Definition',front:'Mixed economy',back:'An economy in which resources are allocated partly by the market and partly by government.',note:'Most real economies are mixed.'},
{id:'c12',type:'card',ch:'1.5',t:'Definition',front:'Production possibility curve',back:'A curve showing the maximum combinations of two goods an economy can produce when all resources are fully and efficiently employed.',note:'Inside the curve means unused resources; outside is currently impossible.'},
{id:'c13',type:'card',ch:'1.5',t:'Definition',front:'Opportunity cost on a PPC',back:'The amount of one good that must be given up to produce one more unit of the other good, shown by the slope of the curve.',note:'A concave shape means increasing opportunity cost.'},
{id:'c14',type:'card',ch:'1.6',t:'Definition',front:'Public good',back:'A good that is non-rival and non-excludable, so the free market under-provides it.',note:'Examples: defence, street lighting, flood control.'},
{id:'c15',type:'card',ch:'1.6',t:'Definition',front:'Merit good',back:'A good whose benefits consumers underestimate or which creates positive externalities, so it is under-consumed in a free market.',note:'Examples: education, vaccines; corrected by subsidy or compulsion.'},
{id:'c16',type:'card',ch:'1.6',t:'Definition',front:'Demerit good',back:'A good whose costs consumers underestimate or which creates negative externalities, so it is over-consumed in a free market.',note:'Examples: tobacco, sugary drinks; corrected by tax or regulation.'},
{id:'c17',type:'card',ch:'1.6',t:'Definition',front:'Free rider',back:'A person who consumes a good without paying for it because the good is non-excludable.',note:'The direct cause of under-provision of public goods.'},
{id:'c18',type:'card',ch:'2.1',t:'Definition',front:'Effective demand',back:'The willingness and ability to buy a given quantity at a given price at a given time.',note:'Willingness alone is not demand.'},
{id:'c19',type:'card',ch:'2.1',t:'Definition',front:'Joint supply',back:'A situation in which the production of one good automatically produces another good as a by-product.',note:'Beef and leather.'},
{id:'c20',type:'card',ch:'2.2',t:'Definition',front:'PED',back:'The percentage change in quantity demanded divided by the percentage change in price; usually negative.',note:'|PED| above 1 is elastic; 0 is perfectly inelastic.'},
{id:'c21',type:'card',ch:'2.2',t:'Definition',front:'YED',back:'The percentage change in quantity demanded divided by the percentage change in income.',note:'Positive normal (above 1 luxury); negative inferior.'},
{id:'c22',type:'card',ch:'2.2',t:'Definition',front:'XED',back:'The percentage change in quantity demanded of good A divided by the percentage change in the price of good B.',note:'Positive substitutes; negative complements.'},
{id:'c23',type:'card',ch:'2.3',t:'Definition',front:'PES',back:'The percentage change in quantity supplied divided by the percentage change in price.',note:'Time is the key determinant.'},
{id:'c24',type:'card',ch:'2.4',t:'Definition',front:'Equilibrium price',back:'The price at which quantity demanded equals quantity supplied, so there is no tendency for price to change.',note:'A shortage pushes price up; a surplus pushes it down.'},
{id:'c25',type:'card',ch:'2.5',t:'Definition',front:'Consumer surplus',back:'The difference between the total amount consumers are willing to pay and the amount they actually pay.',note:'Area below demand and above price.'},
{id:'c26',type:'card',ch:'2.5',t:'Definition',front:'Producer surplus',back:'The difference between the price producers receive and the minimum price they would accept.',note:'Area above supply and below price.'},
{id:'c27',type:'card',ch:'3.1',t:'Definition',front:'Market failure',back:'A situation in which the free market allocates resources inefficiently, so social welfare is not maximised.',note:'Externalities, public goods, information failure, monopoly, inequality.'},
{id:'c28',type:'card',ch:'3.1',t:'Definition',front:'Government failure',back:'A situation in which government intervention worsens resource allocation and reduces welfare.',note:'Poor information, distorted incentives, rent-seeking, enforcement costs.'},
{id:'c29',type:'card',ch:'3.2',t:'Definition',front:'Specific tax',back:'A fixed amount of tax charged per unit sold, which shifts the supply curve upwards by that amount.',note:'The tax per unit is constant.'},
{id:'c30',type:'card',ch:'3.2',t:'Definition',front:'Ad valorem tax',back:'A tax charged as a percentage of the price, so the tax paid rises as price rises.',note:'The supply curve pivots rather than shifts.'},
{id:'c31',type:'card',ch:'3.2',t:'Definition',front:'Tax incidence',back:'The division of the burden of a tax between consumers and producers, determined by the relative elasticities of demand and supply.',note:'The less elastic side bears more; at the limit one side bears all.'},
{id:'c32',type:'card',ch:'3.2',t:'Definition',front:'Maximum price',back:'A legal ceiling on price set below equilibrium, which creates a shortage and requires non-price rationing.',note:'Black markets, queues, quality cuts.'},
{id:'c33',type:'card',ch:'3.2',t:'Definition',front:'Minimum price',back:'A legal floor on price set above equilibrium, which creates a surplus that may need government purchase or storage.',note:'Example: guaranteed prices for farmers.'},
{id:'c34',type:'card',ch:'3.3',t:'Definition',front:'Income',back:'A flow of money received over a period of time from wages, rent, interest, profit or transfers.',note:'A flow concept.'},
{id:'c35',type:'card',ch:'3.3',t:'Definition',front:'Wealth',back:'A stock of accumulated assets owned at a particular point in time.',note:'A stock, including property and financial assets.'},
{id:'c36',type:'card',ch:'3.3',t:'Definition',front:'Gini coefficient',back:'A measure of income inequality ranging from 0 (perfect equality) to 1 (perfect inequality), derived from the Lorenz curve.',note:'A higher value means more inequality.'},
{id:'c37',type:'card',ch:'4.1',t:'Definition',front:'GDP',back:'The total market value of final goods and services produced within a country in a given period.',note:'Domestic principle; excludes intermediate goods and transfers.'},
{id:'c38',type:'card',ch:'4.1',t:'Definition',front:'GNI',back:'GDP plus net factor income from abroad.',note:'Residence principle.'},
{id:'c39',type:'card',ch:'4.1',t:'Definition',front:'Real GDP',back:'GDP measured at constant prices, having removed the effect of inflation.',note:'Nominal GDP uses current prices.'},
{id:'c40',type:'card',ch:'4.1',t:'Definition',front:'GDP deflator',back:'A price index covering all domestically produced output, used to convert nominal GDP into real GDP.',note:'Broader coverage than the CPI.'},
{id:'c41',type:'card',ch:'4.2',t:'Definition',front:'Injections',back:'Spending that enters the circular flow from outside households: investment, government expenditure and exports.',note:'I + G + X.'},
{id:'c42',type:'card',ch:'4.2',t:'Definition',front:'Leakages',back:'Income that leaves the circular flow before it is spent on domestic output: saving, taxation and imports.',note:'S + T + M.'},
{id:'c43',type:'card',ch:'4.2',t:'Definition',front:'Multiplier',back:'The number of times an initial change in spending is amplified into a larger change in national income.',note:'1/(1−MPC), or 1/(MPS+MPT+MPM).'},
{id:'c44',type:'card',ch:'4.3',t:'Definition',front:'Aggregate demand',back:'Total planned spending on goods and services at a given price level: C + I + G + (X − M).',note:'A fall in the price level moves along the AD curve.'},
{id:'c45',type:'card',ch:'4.3',t:'Definition',front:'SRAS',back:'The relationship between output and the price level when at least one factor cost, usually wages, is fixed.',note:'Rising costs shift it left, giving stagflation.'},
{id:'c46',type:'card',ch:'4.3',t:'Definition',front:'LRAS',back:'The maximum output an economy can produce when all factors of production are fully employed; vertical in the neo-classical model.',note:'A rightward shift is potential growth.'},
{id:'c47',type:'card',ch:'4.4',t:'Definition',front:'Output gap',back:'The difference between actual output and potential output, expressed as a percentage of potential output.',note:'Negative gap is spare capacity; positive gap is overheating.'},
{id:'c48',type:'card',ch:'4.4',t:'Definition',front:'Economic growth',back:'An increase in real GDP over time; short-run growth uses spare capacity while long-run growth requires LRAS to shift right.',note:'Growth is not the same as development.'},
{id:'c49',type:'card',ch:'4.5',t:'Definition',front:'Structural unemployment',back:'Unemployment caused by a mismatch between the skills or location of workers and the requirements of available jobs.',note:'Caused by structural change in industry or technology.'},
{id:'c50',type:'card',ch:'4.5',t:'Definition',front:'Full employment',back:'The level of employment at which only frictional and seasonal unemployment remain.',note:'Not zero unemployment.'},
{id:'c51',type:'card',ch:'4.6',t:'Definition',front:'Inflation',back:'A sustained rise in the general price level which reduces the purchasing power of money.',note:'Distinguish from a one-off price rise.'},
{id:'c52',type:'card',ch:'4.6',t:'Definition',front:'CPI',back:'A weighted index of the prices of a representative basket of consumer goods, compared with a base year.',note:'Weights need updating; substitution bias.'},
{id:'c53',type:'card',ch:'4.6',t:'Definition',front:'Demand-pull inflation',back:'Inflation caused by aggregate demand growing faster than the capacity of the economy to produce.',note:'AD shifts right; output and prices rise together.'},
{id:'c54',type:'card',ch:'4.6',t:'Definition',front:'Cost-push inflation',back:'Inflation caused by rising costs of production, which shifts SRAS to the left.',note:'Output falls while prices rise: stagflation.'},
{id:'c55',type:'card',ch:'5.2',t:'Definition',front:'Fiscal policy',back:'The use of government spending and taxation to influence aggregate demand and the level of economic activity.',note:'Expansionary: spend more, tax less. Contractionary: the reverse.'},
{id:'c56',type:'card',ch:'5.2',t:'Definition',front:'Automatic stabiliser',back:'A feature such as progressive taxation or unemployment benefit that dampens fluctuations without any new policy decision.',note:'Taxes rise automatically in a boom; benefits rise in a slump.'},
{id:'c57',type:'card',ch:'5.2',t:'Definition',front:'Crowding out',back:'A situation where government borrowing raises interest rates and so reduces private sector investment.',note:'Weakens the effect of expansionary fiscal policy.'},
{id:'c58',type:'card',ch:'5.3',t:'Definition',front:'Monetary policy',back:'The use of interest rates, the money supply and exchange rate tools by the central bank to influence inflation and demand.',note:'Transmission: interest rate → borrowing → spending → AD.'},
{id:'c59',type:'card',ch:'5.3',t:'Definition',front:'Quantitative easing',back:'Central bank purchases of financial assets to inject money into the economy and lower long-term interest rates.',note:'Used when interest rates are near zero.'},
{id:'c60',type:'card',ch:'5.4',t:'Definition',front:'Supply-side policy',back:'Policies that increase the productive capacity of the economy, such as education, infrastructure, deregulation and tax reform.',note:'Market-based versus interventionist.'},
{id:'c61',type:'card',ch:'6.1',t:'Definition',front:'Comparative advantage',back:'A country has a comparative advantage in a good when it can produce it at a lower opportunity cost than a trading partner.',note:'Drives specialisation, not absolute efficiency.'},
{id:'c62',type:'card',ch:'6.1',t:'Definition',front:'Absolute advantage',back:'The ability to produce more output with the same resources, or the same output with fewer resources, than a trading partner.',note:'Absolute advantage alone does not explain the gains from trade.'},
{id:'c63',type:'card',ch:'6.2',t:'Definition',front:'Tariff',back:'A tax on imported goods which raises their domestic price and protects domestic producers.',note:'Raises revenue; consumers lose.'},
{id:'c64',type:'card',ch:'6.2',t:'Definition',front:'Quota',back:'A physical limit on the quantity of a good that may be imported in a period.',note:'Rent goes to licence holders and invites rent-seeking.'},
{id:'c65',type:'card',ch:'6.3',t:'Definition',front:'Current account',back:'The record of trade in goods and services, primary income and current transfers between residents and the rest of the world.',note:'Excludes financial account flows.'},
{id:'c66',type:'card',ch:'6.4',t:'Definition',front:'Depreciation',back:'A fall in the value of a currency in a floating exchange rate system caused by market forces.',note:'Distinguish from devaluation under a fixed rate.'},
{id:'c67',type:'card',ch:'6.5',t:'Definition',front:'Expenditure-switching policy',back:'Policies such as devaluation or tariffs that switch domestic spending from imports towards home-produced goods.',note:'Contrast with expenditure-reducing policies.'}
];

/* ===== Built-in bank · short answers (English) ===== */
const BUILTIN_SHORT = [
{id:'s01',type:'short',ch:'1.1',t:'8 marks',q:'Explain why scarcity requires choices and what is meant by opportunity cost. (8)',pts:[{t:'Accurate definition of scarcity: unlimited wants, limited resources',s:2},{t:'Explains that choosing is therefore unavoidable and resources must be allocated',s:2},{t:'Definition of opportunity cost: value of the next best alternative forgone',s:2},{t:'A concrete example, personal or government, showing the trade-off',s:2}],model:'Scarcity means wants are unlimited while the resources available to satisfy them are limited. Because resources cannot satisfy every want, individuals, firms and governments must choose how to allocate them. Every choice therefore carries an opportunity cost, the value of the next best alternative forgone. For example, if a government spends a fixed budget on a new hospital, the opportunity cost is the school or road that could have been built instead. This depends on which alternative is genuinely the next best one, not on the money actually paid.'},
{id:'s02',type:'short',ch:'1.5',t:'8 marks',q:'Using a PPC, explain how an economy that devotes more resources to capital goods may change its production possibilities over time. (8)',pts:[{t:'Describes the PPC: maximum combinations with full and efficient employment',s:2},{t:'Movement along the curve means fewer consumer goods now, with increasing opportunity cost',s:2},{t:'Capital goods raise future capacity, shifting the whole curve outwards',s:3},{t:'One sentence weighing the short run against the long run',s:1}],model:'A PPC shows the maximum combinations of consumer and capital goods an economy can produce with all resources fully employed. Moving along the curve towards capital goods means fewer consumer goods now, and the concave shape shows increasing opportunity cost as resources less suited to capital production are used. Capital goods, however, add to the capital stock, so in later periods the curve shifts outwards and more of both goods can be produced. The size of the gain depends on whether the capital is used productively and on how long the investment takes to come on stream.'},
{id:'s03',type:'short',ch:'2.2',t:'8 marks',q:'Explain two determinants of price elasticity of demand and how elasticity affects a firm total revenue. (8)',pts:[{t:'First determinant: number and closeness of substitutes, with the mechanism',s:2},{t:'Second determinant: necessity, share of income or time horizon',s:2},{t:'With |PED| above 1, cutting price raises revenue and raising price reduces it',s:2},{t:'With |PED| below 1, raising price raises revenue',s:2}],model:'PED measures the responsiveness of quantity demanded to a price change. It is high when close substitutes exist, because consumers can switch easily, and low for necessities or when the good takes a small share of income. If demand is elastic, a price rise lowers total revenue because the fall in quantity outweighs the higher price, and a price cut raises revenue. If demand is inelastic, raising price increases revenue. This depends on the actual elasticity at the current price, which the firm has to estimate before changing price.'},
{id:'s04',type:'short',ch:'2.4',t:'8 marks',q:'Explain how the price mechanism removes a shortage in a free market. (8)',pts:[{t:'Defines a shortage: price below equilibrium, quantity demanded exceeds supply',s:2},{t:'Rising price rations demand as consumers move up the demand curve',s:2},{t:'Rising price gives an incentive for supply to increase along the supply curve',s:2},{t:'Explains the return to equilibrium, or notes that a binding maximum price blocks it',s:2}],model:'A shortage exists when price is below equilibrium, so quantity demanded exceeds quantity supplied. Unsatisfied buyers bid the price up. As price rises, the rationing function means some consumers reduce or postpone purchases, while the incentive function means higher price and profit encourage producers to supply more. Price continues to rise until quantity demanded equals quantity supplied, so the shortage disappears. This only works if the market is free to adjust, so a binding maximum price would keep the shortage in place.'},
{id:'s05',type:'short',ch:'3.2',t:'12 marks',q:'Discuss whether a maximum price is an effective way to help low-income consumers. (12)',pts:[{t:'Mechanism: a ceiling below equilibrium creates a shortage',s:2},{t:'Benefit: lower prices cut essential spending for low-income households',s:2},{t:'Drawbacks: shortage, queues, black markets, quality cuts and falling supply',s:3},{t:'Alternatives: subsidy, targeted transfers, expanding supply',s:3},{t:'Conditional judgement: depends on the size of the gap and enforcement',s:2}],model:'A maximum price set below equilibrium lowers the price of a necessity such as rent or food, which directly reduces spending by low-income households. However, at that price quantity demanded exceeds quantity supplied, so a shortage appears and allocation occurs through queues, rationing or black markets; producers may cut quality or exit, and supply shrinks over time. Poor households may therefore face less supply rather than lower prices, and those without time or contacts lose out. Subsidies or targeted cash transfers preserve the price signal while helping the poor, and raising supply is more durable. Whether the ceiling works depends on how far it is set below equilibrium and on how effectively non-price rationing is enforced.'},
{id:'s06',type:'short',ch:'3.2',t:'12 marks',q:'Discuss who bears the burden of an indirect tax on a good. (12)',pts:[{t:'The tax shifts supply up, so price rises and quantity falls',s:2},{t:'Incidence depends on the relative elasticities of demand and supply',s:3},{t:'Inelastic demand with elastic supply: consumers bear most, as with necessities',s:3},{t:'Elastic demand with inelastic supply: producers absorb most',s:2},{t:'Also depends on market power, substitutes and the time period',s:2}],model:'An indirect tax raises the cost of supply, shifting the supply curve up, so the new equilibrium has a higher price and a smaller quantity. The burden falls mainly on the side of the market that is less elastic, because that side cannot easily escape the tax. If demand is inelastic, as for cigarettes or basic food, consumers pay most of the tax and quantity falls only slightly, which is why governments tax demerit goods. If demand is elastic and supply inelastic, producers absorb most of the tax through lower net revenue. The outcome also depends on market power and on the time period, since elasticities rise as consumers find substitutes.'},
{id:'s07',type:'short',ch:'3.3',t:'8 marks',q:'Explain two causes of income inequality within a country. (8)',pts:[{t:'Cause one: differences in education, skills and experience, and the wage mechanism',s:3},{t:'Cause two: unequal ownership of wealth and its returns, or precarious employment',s:3},{t:'Explains what amplifies inequality, such as a regressive tax system or unequal access',s:2}],model:'One cause is differences in education, skills and experience, which change worker productivity and therefore wages; as demand grows for skilled labour, the wage gap widens. Another is the distribution of wealth and its returns: owners of property and shares receive rent, interest and dividends that can be passed on, so wealth accumulates and generates further income. Employment structure matters too, since temporary or informal work brings low and unstable pay. The final degree of inequality depends on how progressive the tax and benefit system is and on equality of access to education.'},
{id:'s08',type:'short',ch:'4.2',t:'8 marks',q:'Explain how injections and leakages affect the level of national income. (8)',pts:[{t:'Defines injections I + G + X and leakages S + T + M',s:2},{t:'Injections raise spending, and income expands through the multiplier',s:2},{t:'Leakages reduce spending, so income contracts',s:2},{t:'Equilibrium where injections equal leakages, with the multiplier determining the size',s:2}],model:'In the circular flow, income earned by households is either spent on domestic output or leaks out as saving, taxation and imports, while spending enters from outside as investment, government expenditure and exports. If injections exceed leakages, total spending rises and firms expand output and employment, so national income increases by more than the initial injection through the multiplier. If leakages exceed injections, spending falls and income contracts. Equilibrium is reached where injections equal leakages. How large the change is depends on the size of the multiplier, which is smaller when the marginal propensity to save, tax and import is high.'},
{id:'s09',type:'short',ch:'4.3',t:'12 marks',q:'Discuss whether an increase in aggregate demand always raises output. (12)',pts:[{t:'Mechanism: AD shifts right along SRAS, raising output and prices',s:2},{t:'With spare capacity the output response is large and inflation pressure small',s:3},{t:'Near or beyond full capacity the SRAS steepens and extra spending mostly raises prices',s:3},{t:'Supply constraints: skilled labour, capital, imported inputs, composition of demand',s:2},{t:'Conditional judgement',s:2}],model:'A rise in aggregate demand shifts AD to the right; along an upward-sloping SRAS, firms produce more at higher prices, so output and the price level both rise. When spare capacity and unemployment exist, the output response is large and inflation pressure is modest. As the economy approaches full capacity, SRAS becomes steeper and extra spending mostly raises prices rather than output. Supply-side limits also matter: shortages of skilled labour, capital or imported inputs determine how much can actually be supplied. Whether output rises therefore depends on the size of the output gap and on whether supply can expand; in a fully employed economy, demand growth mainly produces inflation.'},
{id:'s10',type:'short',ch:'4.4',t:'12 marks',q:'Discuss the extent to which economic growth improves living standards. (12)',pts:[{t:'Benefits: higher incomes, more employment, more tax revenue for public services',s:2},{t:'Quality of growth: resource depletion and pollution reduce welfare',s:3},{t:'Distribution: gains may accrue to a few, so average income overstates improvement',s:3},{t:'Limits of GDP: unpaid work, leisure, health, externalities',s:2},{t:'Conditional judgement',s:2}],model:'Growth raises real GDP per head, which normally means higher incomes, more employment and more tax revenue for public services, so material living standards usually improve. However, growth that relies on resource depletion or heavy pollution can reduce welfare, because these costs are not deducted from GDP. The distribution of the gains also matters: if growth accrues to a small group, average income rises while many households see little change. GDP also omits unpaid work, leisure, health and safety. Whether growth improves living standards therefore depends on its composition, its sustainability and how the gains are shared.'},
{id:'s11',type:'short',ch:'4.5',t:'12 marks',q:'Discuss the policies a government could use to reduce structural unemployment. (12)',pts:[{t:'Defines structural unemployment as a skills or location mismatch',s:2},{t:'Education, vocational training and apprenticeships',s:3},{t:'Relocation grants, affordable housing and transport to improve mobility',s:3},{t:'Regional and industrial policy, infrastructure investment',s:2},{t:'Limits: slow, costly, may mismatch future demand; demand stimulus does not help',s:2}],model:'Structural unemployment arises when the skills or location of workers no longer match available jobs, often after deindustrialisation or rapid technical change. Education, vocational training and apprenticeships can equip workers with the skills employers now demand, while relocation grants, affordable housing and better transport reduce the geographical mismatch. Regional policy and infrastructure investment can create jobs in depressed areas. These measures are costly and slow, training may not match future demand, and retraining does not help those unable or unwilling to move. By contrast, general demand stimulus does little for structural unemployment and risks inflation. Success therefore depends on accurate information about skill shortages and on sustained funding.'},
{id:'s12',type:'short',ch:'4.6',t:'12 marks',q:'Discuss the costs of inflation to an economy. (12)',pts:[{t:'Loss of purchasing power for fixed-income households and creditors',s:2},{t:'Uncertainty reduces investment; menu and search costs rise',s:2},{t:'Falling international competitiveness if inflation exceeds partners, unless the currency depreciates',s:3},{t:'Redistribution between debtors and savers',s:3},{t:'Judgement: depends on the rate, predictability and indexation',s:2}],model:'Inflation reduces the purchasing power of money, so households on fixed incomes and creditors receiving fixed nominal payments lose out, while borrowers gain as the real value of debt falls. Uncertainty about future prices discourages investment and long-term contracts and raises menu and search costs, which lowers efficiency. If domestic inflation exceeds that of trading partners, exports become less competitive unless the exchange rate depreciates. How damaging this is depends on the rate and predictability of inflation: moderate, stable and indexed inflation causes far less harm than high or volatile inflation.'},
{id:'s13',type:'short',ch:'5.2',t:'12 marks',q:'Discuss whether fiscal policy is the best way to end a recession. (12)',pts:[{t:'Mechanism: higher spending or lower taxes raises AD, output and employment',s:2},{t:'Advantages: directly raises demand, can be targeted, works at the zero bound',s:3},{t:'Limits: implementation lags, crowding out, debt and interest costs',s:3},{t:'Comparison with monetary policy: faster but possibly ineffective',s:2},{t:'Conditional judgement',s:2}],model:'In a recession caused by weak aggregate demand, higher government spending or lower taxes raises AD, so firms sell more and hire, and the multiplier amplifies the effect. Fiscal policy can be targeted at infrastructure or at low-income households, and it still works when interest rates are near zero. However, decisions and spending take time, so stimulus may arrive after recovery; borrowing can push up interest rates and crowd out investment, and deficits add to debt and future interest costs. Monetary policy acts faster but may fail in a deep recession. Whether fiscal policy is best depends on the size of the output gap, the speed of implementation and the fiscal space available.'},
{id:'s14',type:'short',ch:'5.3',t:'12 marks',q:'Discuss how effective monetary policy is in controlling inflation. (12)',pts:[{t:'Mechanism: higher rates raise borrowing costs, cut consumption and investment, so AD contracts',s:2},{t:'Most effective against demand-pull inflation',s:2},{t:'Against cost-push inflation, tightening cuts output as well, at high cost',s:3},{t:'Limits: lags, weak transmission, zero bound, exchange rate and capital flows',s:3},{t:'Conditional judgement',s:2}],model:'Higher interest rates raise the cost of borrowing and the return on saving, so consumption and investment fall, aggregate demand contracts and inflationary pressure eases. This works best against demand-pull inflation, where the excess is clearly in spending. When inflation is cost-push, tightening reduces demand and output without removing the cost increase, so unemployment rises while prices stay high. Policy also suffers from time lags and uncertain transmission, is weaker when rates are near zero, and can attract capital inflows that appreciate the currency and hurt exporters. Its effectiveness therefore depends on the source of inflation, the sensitivity of borrowers to rates and the credibility of the central bank.'},
{id:'s15',type:'short',ch:'6.1',t:'8 marks',q:'Explain the difference between absolute and comparative advantage. (8)',pts:[{t:'Absolute advantage: fewer resources for the same output',s:2},{t:'Comparative advantage: lower opportunity cost',s:2},{t:'A numerical example showing the two can differ',s:2},{t:'Comparative advantage, not absolute, explains gains from trade',s:2}],model:'A country has an absolute advantage when it can produce a good using fewer resources than a trading partner, so output per worker is higher. Comparative advantage compares opportunity costs: the country that gives up less of another good to produce one unit has the comparative advantage. A country may be more efficient in both goods, yet still have a comparative advantage in only one, because its advantage is larger there. Specialising according to comparative advantage raises total output, so trade benefits both partners even if one is absolutely less efficient. This is why comparative advantage, not absolute advantage, explains the gains from trade.'},
{id:'s16',type:'short',ch:'6.2',t:'12 marks',q:'Discuss whether a country should protect its domestic steel industry. (12)',pts:[{t:'Arguments for: employment, strategic supply, infant industry, anti-dumping',s:3},{t:'Arguments against: higher consumer and downstream costs, retaliation',s:3},{t:'Efficiency loss: resources diverted from comparative advantage',s:3},{t:'Alternatives: adjustment assistance, retraining, temporary safeguards',s:2},{t:'Conditional judgement',s:1}],model:'Protection may preserve steel jobs, secure a strategic input, and a temporary tariff can shelter an industry while it restructures or defends itself against dumping. However, tariffs raise costs for construction and manufacturing that use steel, making domestic producers less competitive, and consumers pay more; trading partners may retaliate, harming exports. Protection also delays adjustment away from an industry where the country may lack comparative advantage. Targeted adjustment assistance, retraining and temporary safeguards are usually cheaper than permanent protection. Whether protection is justified depends on whether the industry has a realistic path to competitiveness and on the risk of retaliation.'},
{id:'s17',type:'short',ch:'6.5',t:'8 marks',q:'Explain expenditure-reducing and expenditure-switching policies used to correct a current account deficit. (8)',pts:[{t:'Expenditure-reducing: tighter fiscal or monetary policy cuts import demand',s:3},{t:'Expenditure-switching: devaluation, tariffs or export subsidies redirect spending',s:3},{t:'Side effects and the J-curve as a judgement',s:2}],model:'Expenditure-reducing policies cut total domestic spending through higher taxes, lower government spending or higher interest rates, so households and firms buy fewer imports and the deficit narrows, though growth and employment slow. Expenditure-switching policies change the composition rather than the level of spending: a depreciation makes imports dearer and exports cheaper, while tariffs or export subsidies redirect demand to domestic goods. Switching works only if consumers respond to price changes, and the J-curve means the deficit may worsen before it improves. The choice depends on whether the deficit comes from excess domestic demand or from a price competitiveness problem.'},
{id:'s18',type:'short',ch:'T',t:'8 marks',q:'Outline the structure you would use for an 8-mark explain question, and where the marks come from. (8)',pts:[{t:'Open with a precise definition or statement of the concept (AO1)',s:2},{t:'Build a causal chain, each step linked with connectives',s:2},{t:'Apply the chain to the context given in the question (AO2)',s:2},{t:'Close with one conditional evaluative sentence (AO3)',s:2}],model:'For an 8-mark explain question, open with a precise definition, since AO1 knowledge carries about three marks. Then build a chain of reasoning rather than a list: each sentence should show how one change leads to the next, using connectives such as therefore, as a result and which means. Apply the chain to the context given in the question to earn AO2 marks. Finish with one evaluative sentence, such as this depends on the elasticity of demand or on the time allowed, which secures the AO3 marks. A common error is writing three separate definitions with no mechanism, which caps the answer at the knowledge marks.'},
{id:'s19',type:'short',ch:'T',t:'12 marks',q:'Explain how to structure a 12-mark discuss essay to reach the top band. (12)',pts:[{t:'Introduction: define key terms and state the two sides to be examined',s:2},{t:'Two developed arguments for one side, each with mechanism and context',s:3},{t:'Two arguments for the other side, showing when the first arguments fail',s:3},{t:'Evaluation: short run versus long run, scale, elasticity, implementation',s:2},{t:'Conclusion: conditional judgement with a clear direction',s:2}],model:'A 12-mark answer is marked on knowledge, application, analysis and evaluation, so structure matters. Begin by defining the key terms and stating the two sides you will examine. In the body, give two developed arguments for one side, each with a mechanism and a link to the context, then two arguments for the other side, showing the conditions under which the first arguments fail. Evaluation should compare the strength of the arguments, distinguishing short run from long run, small from large economies, or elastic from inelastic responses. Conclude with a conditional judgement that answers the question directly, for example whether the policy works depends on the size of the output gap. Balance and a clear final judgement separate the top band from a list of points.'},
{id:'s20',type:'short',ch:'T',t:'12 marks',q:'Explain the role of evaluation in 12-mark answers and give two templates you can reuse. (12)',pts:[{t:'Evaluation weighs arguments and states conditions, rather than summarising',s:2},{t:'Template one: short run versus long run, depending on time',s:3},{t:'Template two: group judgement, depending on the type of country, firm or household',s:3},{t:'Every evaluative sentence uses a variable from the question',s:2},{t:'The conclusion echoes the evaluation with a direction',s:2}],model:'Evaluation is not a summary of both sides; it weighs them and states the conditions under which one argument dominates, which is what AO3 rewards. One reliable template is the short-run versus long-run judgement: a policy may raise output now but only inflation later, so whether it works depends on the time horizon and on spare capacity. A second template is group-based: the effect may hold for large firms with elastic supply but not for small ones, or for countries with a floating exchange rate but not for a pegged one. Each evaluative sentence must use a variable from the question, and the conclusion should restate that condition with a clear direction.'}
];

let storeOK = true;
function load(key, fallback){
  try { const raw = localStorage.getItem(key); if (raw) return JSON.parse(raw); } catch(e){ storeOK = false; }
  return fallback;
}
function save(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); storeOK = true; }
  catch(e){ storeOK = false; }
}

/* ---------- statistics ---------- */
function pOf(id){ return prog[id] || { n:0, r:0, w:0, box:0, ts:0 }; }
function isMastered(id){ return pOf(id).box >= 3; }
function dueCount(){ return bank.filter(q => { const p = pOf(q.id); return p.n > 0 && p.box < 3; }).length; }
function practisedCount(){ return bank.filter(q => pOf(q.id).n > 0).length; }
function accuracy(){
  let n = 0, r = 0;
  bank.forEach(q => { const p = pOf(q.id); n += p.n; r += p.r; });
  return n ? Math.round(r / n * 100) : 0;
}
function attempt(id, ok){
  const p = pOf(id);
  p.n += 1;
  if (ok) { p.r += 1; p.box = Math.min(5, (p.box || 0) + 1); }
  else { p.w += 1; p.box = 1; }
  p.ts = Date.now();
  prog[id] = p;
  persistProg();
  queueProg(id);
}
function attemptScore(id, ratio){
  const p = pOf(id);
  p.n += 1;
  if (ratio >= 0.7) { p.r += 1; p.box = Math.min(5, (p.box || 0) + 1); }
  else { p.w += 1; p.box = 1; }
  p.ts = Date.now();
  prog[id] = p;
  persistProg();
  queueProg(id);
}

async function ensureClient(){
  if (sb) return sb;
  if (!connected()) return null;
  if (!window.supabase){
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      const timer = setTimeout(() => reject(new Error('the account library took too long to load — check the network')), 12000);
      s.src = SB_LIB;
      s.onload = () => { clearTimeout(timer); resolve(); };
      s.onerror = () => { clearTimeout(timer); reject(new Error('the account library did not load — check the network')); };
      document.head.appendChild(s);
    });
  }
  sb = window.supabase.createClient(backend.url, backend.key, { auth: { persistSession: true, autoRefreshToken: true } });
  return sb;
}

const rowOf = q => ({
  id:q.id, type:q.type, ch:q.ch || '?', t:q.t || '',
  q:q.q || '', o:q.o || null, a:(typeof q.a === 'number' ? q.a : null), e:q.e || '',
  front:q.front || '', back:q.back || '', note:q.note || '',
  pts:q.pts || null, model:q.model || '', src:q.src || '', img:q.img || '', msimg:q.msimg || ''
});
const itemOf = r => {
  const o = { id:r.id, type:r.type, ch:r.ch || '?' };
  if (r.type === 'card') { o.front = r.front || ''; o.back = r.back || ''; o.note = r.note || ''; }
  else if (r.type === 'short') { o.q = r.q || ''; if (r.pts && r.pts.length) o.pts = r.pts; if (r.model) o.model = r.model; if (r.msimg) o.msimg = r.msimg; }
  else { o.q = r.q || ''; o.o = Array.isArray(r.o) ? r.o : []; o.a = r.a || 0; o.e = r.e || ''; }
  if (r.t) o.t = r.t;
  if (r.src) o.src = r.src;
  if (r.img) o.img = r.img;
  return o;
};

async function loadCloudBank(){
  const c = await ensureClient();
  if (!c) return false;
  const { data, error } = await c.from('items').select('*');
  if (error) throw error;
  if (data && data.length){
    bank = data.map(itemOf);
    save(LS_BANK, bank);
    meta = { ts: Date.now(), src: 'Cloud bank' };
    save(LS_META, meta);
  }
  return true;
}

async function pushBank(){
  const c = await ensureClient();
  if (!c || !signedIn() || sess.role !== 'admin') return;
  const { error } = await c.from('items').upsert(bank.map(rowOf), { onConflict: 'id' });
  if (error) return toast('Cloud save failed: ' + error.message);
  if (bank.length < 1200){
    const ids = bank.map(q => q.id).join(',');
    const { error: e2 } = await c.from('items').delete().not('id', 'in', `(${ids})`);
    if (e2) console.warn('cleanup failed', e2.message);
  }
  meta.ts = Date.now(); save(LS_META, meta);
}

async function loadCloudProgress(){
  const c = await ensureClient();
  if (!c || !signedIn()) return;
  const { data, error } = await c.from('progress').select('*').eq('user_id', sess.user.id);
  if (error) throw error;
  const p = {};
  (data || []).forEach(r => { p[r.item_id] = { n:r.n || 0, r:r.r || 0, w:r.w || 0, box:r.box || 0, ts:Number(r.ts) || 0 }; });
  prog = p;
  save(LS_PROG, prog);
}

function queueProg(id){
  if (!signedIn()) return;
  dirtyProg[id] = prog[id];
  clearTimeout(progTimer);
  progTimer = setTimeout(flushProg, 1600);
}

async function flushProg(){
  if (!Object.keys(dirtyProg).length) return;
  const c = await ensureClient();
  if (!c || !signedIn()){ dirtyProg = {}; return; }
  const rows = Object.keys(dirtyProg).map(id => {
    const p = dirtyProg[id] || {};
    return { user_id: sess.user.id, item_id: id, n:p.n || 0, r:p.r || 0, w:p.w || 0, box:p.box || 0, ts:p.ts || 0 };
  });
  dirtyProg = {};
  const { error } = await c.from('progress').upsert(rows, { onConflict: 'user_id,item_id' });
  if (error) toast('Progress not synced: ' + error.message);
}

async function clearCloudProgress(){
  const c = await ensureClient();
  if (!c || !signedIn()) return;
  const { error } = await c.from('progress').delete().eq('user_id', sess.user.id);
  if (error) toast('Cloud history not cleared: ' + error.message);
}

async function loadRole(){
  const c = await ensureClient();
  if (!c || !sess.user){ sess.role = 'guest'; return; }
  const { data } = await c.from('profiles').select('role').eq('id', sess.user.id).maybeSingle();
  sess.role = (data && data.role) || 'student';
  sess.email = sess.user.email || '';
}

async function signIn(email, pass){
  const c = await ensureClient();
  if (!c) throw new Error('connect the backend first');
  const { data, error } = await c.auth.signInWithPassword({ email, password: pass });
  if (error) throw error;
  sess.user = data.user; await loadRole();
  await loadCloudProgress();
  closeModal(); toast(`Signed in as ${roleName()}`);
  paintStatus(); render();
}

async function signUpAccount(email, pass){
  const c = await ensureClient();
  if (!c) throw new Error('connect the backend first');
  const { data, error } = await c.auth.signUp({ email, password: pass });
  if (error) throw error;
  if (!data.session) throw new Error('check your inbox for the confirmation link, then sign in');
  sess.user = data.session.user; await loadRole();
  await loadCloudProgress();
  closeModal(); toast(`Account created · ${roleName()}`);
  paintStatus(); render();
}

async function signOutNow(){
  await flushProg();
  if (sb) await sb.auth.signOut();
  sess = { user: null, email: '', role: 'guest' };
  prog = {};                      /* the next visitor starts clean */
  closeModal(); toast('Signed out — practising as a guest now');
  paintStatus(); render();
}

async function bootAuth(){
  if (!connected()){ sess.role = 'guest'; prog = {}; paintStatus(); return; }
  try {
    const c = await ensureClient();
    const { data } = await c.auth.getSession();
    if (data && data.session && data.session.user){
      sess.user = data.session.user;
      await loadRole();
      await loadCloudProgress();
    } else {
      prog = {};
    }
    await loadCloudBank();
  } catch (e){
    toast('Account service: ' + e.message);
  }
  paintStatus();
  render();
}

/* ================= MULTIPLE CHOICE ================= */
function mcqPool(chap){
  let items = bank.filter(q => q.type === 'mcq' && (chap === 'all' || q.ch === chap));
  items = shuffle(items);
  return items;
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function renderMCQ(){
  if (!S.mcq || !S.mcq.pool) startMCQ('all');
  const st = S.mcq;
  const q = st.pool[st.i];
  if (!q){ $('#view').innerHTML = `<h2 class="view-t">Multiple choice</h2><div class="empty">No multiple-choice questions in this chapter.</div>`; return; }

  const chaps = ['all', ...CHAP_ORDER.filter(c => bank.some(x => x.type === 'mcq' && x.ch === c))];
  const opts = q.o.map((text, idx) => {
    let cls = 'opt';
    if (st.picked != null){
      if (idx === q.a) cls += ' good';
      else if (idx === st.picked) cls += ' bad';
    }
    return `<button class="${cls}" data-pick="${idx}" ${st.picked != null ? 'disabled' : ''}>
      <span class="k">${'ABCD'[idx]}</span><span>${esc(text)}</span></button>`;
  }).join('');

  const fb = st.picked != null ? `
    <div class="fb ${st.picked === q.a ? '' : 'bad'}">
      <div class="fbt ${st.picked === q.a ? 'ok' : 'no'}">${st.picked === q.a ? 'Correct' : 'Not quite — the answer is ' + 'ABCD'[q.a]}</div>
      <div>${esc(q.e || '')}</div>
    </div>` : '';

  $('#view').innerHTML = `

      <span class="spacer"></span>
      <button class="btn ghost sm" id="reshuffle">Shuffle</button>
    </div>
    <div class="pbar"><i style="width:${Math.round(st.i / st.pool.length * 100)}%"></i></div>
    <div class="study">
    <div class="card pad">
      <div class="qmeta">
        <span class="tag">${q.ch} ${esc(CHAP_NAMES[q.ch] || '')}</span>
        ${q.t ? `<span class="tag amber">${esc(q.t)}</span>` : ''}
        ${q.src ? `<span class="srctag">${esc(srcLabel(q.src))}</span>` : ''}
        <span class="spacer"></span><span class="hint">${pOf(q.id).n ? pOf(q.id).n + (pOf(q.id).n === 1 ? ' attempt' : ' attempts') : 'not practised yet'}</span>
      </div>
      <div class="qtext">${esc(q.q)}</div>
      ${q.img ? `<img class="qimg" src="${esc(q.img)}" alt="figure for this question">` : ''}
      <div class="opts">${opts}</div>
      ${fb}
      <div class="row">
        <button class="btn primary" id="next" ${st.picked == null ? 'disabled' : ''}>Next question</button>
        <button class="btn ghost sm" id="skip">Skip</button>
        <span class="spacer"></span>
        <span class="hint keyhint">Press <span class="kbd">A</span>–<span class="kbd">D</span>, then <span class="kbd">Enter</span></span>
      </div>
    </div>
    ${sidePanel(q.ch, 'mcq')}
    </div>`;

  $('#view').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => pickMCQ(+b.dataset.pick));
  $('#chSel').onchange = e => { startMCQ(e.target.value); renderMCQ(); };
  $('#reshuffle').onclick = () => { startMCQ(st.chap); renderMCQ(); };
  const next = () => {
    st.i += 1; st.picked = null;
    if (st.i >= st.pool.length){ st.i = 0; st.pool = mcqPool(st.chap); toast('Round complete — shuffled again.'); }
    renderMCQ();
  };
  $('#next').onclick = next;
  $('#skip').onclick = next;
}
function startMCQ(chap){ S.mcq = { pool: mcqPool(chap), i: 0, picked: null, chap }; }
function pickMCQ(idx){
  const st = S.mcq;
  if (st.picked != null) return;
  st.picked = idx;

}

  $('#flip').onclick = () => {

  $('#all').onclick = () => { S.cards = { queue: cardsPool(false), flipped:false, round:1 }; renderCards(); };
  $('#yes').onclick = () => { attempt(q.id, true); st.queue.shift(); st.flipped = false; st.round += 1; renderCards(); };
  $('#no').onclick = () => { attempt(q.id, false); const moved = st.queue.shift(); st.queue.push(moved); st.flipped = false; st.round += 1; renderCards(); };
}

/* ================= SHORT ANSWERS ================= */
function shortPool(chap){
  return bank.filter(q => q.type === 'short' && (chap === 'all' || q.ch === chap));
}
function renderShort(){
  if (!S.short) S.short = { i: 0, revealed: false, checks: {}, chap: 'all', drafts: {}, self: {} };
  const st = S.short;
  if (!st.self) st.self = {};
  const items = shortPool(st.chap);
  if (!items.length){ $('#view').innerHTML = `<h2 class="view-t">Short answers</h2><div class="empty">No short-answer tasks in this chapter.</div>`; return; }
  if (!st.pool || st.pool.length !== items.length) st.pool = items;
  const q = st.pool[st.i] || st.pool[0];
  const chaps = ['all', ...CHAP_ORDER.filter(c => bank.some(x => x.type === 'short' && x.ch === c))];
  const hasPts = !!(q.pts && q.pts.length);
  const total = hasPts ? q.pts.reduce((s, p) => s + p.s, 0) : (+(((q.t || '').match(/\d+/) || [0])[0]) || 0);
  const pts = hasPts ? q.pts.map((p, i) => `
    <label class="pt"><input type="checkbox" data-i="${i}" ${st.checks[q.id] && st.checks[q.id][i] ? 'checked' : ''}>
      <span>${esc(p.t)}</span><span class="sc">${p.s} mark${p.s > 1 ? 's' : ''}</span></label>`).join('') : '';
  const got = hasPts
    ? q.pts.reduce((s, p, i) => s + (st.checks[q.id] && st.checks[q.id][i] ? p.s : 0), 0)
    : Math.max(0, Math.min(total, Math.round(+(st.self[q.id] || 0))));

  let revealHtml = '';
  let msBlock = '';
  if (st.revealed){
    if (q.msimg){
      msBlock = `<div class="card pad msbox">
        <div class="qmeta"><span class="tag">Official mark scheme</span><span class="srctag">${esc(srcLabel(q.src))}</span><span class="spacer"></span><a class="srctag" href="${esc(q.msimg)}" target="_blank" rel="noopener">Full size</a></div>
        <p class="hint" style="margin:6px 0 10px">Screenshot of the published mark scheme, reproduced without edits.</p>
        <a class="mslink" href="${esc(q.msimg)}" target="_blank" rel="noopener">
          <img class="msimg" src="${esc(q.msimg)}" alt="Official mark scheme for this question">
        </a>
        <div class="row" style="margin-top:12px">
          <label class="selfmark">Your mark <input id="sm" type="number" min="0" max="${total}" step="1" value="${got || ''}"></label>
          <span class="hint">out of ${total}</span>
          <span class="spacer"></span>
          <a class="btn ghost sm" href="${esc(q.msimg)}" target="_blank" rel="noopener">Open full size</a>
          <button class="btn primary" id="save">Save this mark</button>
          <button class="btn ghost" id="nextq">Next question</button>
        </div>
      </div>`;
    } else {
      revealHtml = `<div class="model">
        <h4>Reference answer</h4><p>${esc(q.model || '')}</p>
        <h4>Mark scheme — tick only what you wrote</h4><div class="pts">${pts}</div>
        <div class="row"><button class="btn" id="save">Save this mark</button><button class="btn ghost" id="nextq">Next question</button></div>
      </div>`;
    }
  }

  $('#view').innerHTML = `
    <h2 class="view-t">Short answers</h2>
    <p class="view-sub">Plan it first, then reveal the mark scheme and mark yourself the way an examiner would. 70 per cent counts as mastered.</p>
    <div class="filterbar">
      <label for="chSel">Chapter</label>
      <select id="chSel">${chaps.map(c => `<option value="${c}"${st.chap===c?' selected':''}>${c==='all'?'All chapters':c+' · '+esc(CHAP_NAMES[c]||'')}</option>`).join('')}</select>
      <span class="spacer"></span>
      <button class="btn ghost sm" id="reshuffle">Shuffle</button>
    </div>
    <div class="pbar"><i style="width:${Math.round(st.i / st.pool.length * 100)}%"></i></div>
    <div class="study">
    <div class="card pad">
      <div class="qmeta"><span class="tag">${q.ch} ${esc(CHAP_NAMES[q.ch] || '')}</span>${q.t?`<span class="tag amber">${esc(q.t)}</span>`:''}${q.src?`<span class="srctag">${esc(srcLabel(q.src))}</span>`:''}
        <span class="spacer"></span>${(q.t && /\d/.test(q.t)) ? '' : `<span class="hint">${hasPts ? (q.pts||[]).length + ' points · ' : ''}${total} marks</span>`}</div>
      <div class="sa-q">${esc(q.q)}</div>
      ${q.img ? `<img class="qimg" src="${esc(q.img)}" alt="figure for this question">` : ''}
      <textarea id="sa" placeholder="Plan it here: definition → mechanism → trade-off → judgement (English or brief notes)">${esc((st.drafts||{})[q.id] || '')}</textarea>
      <div class="row">
        <button class="btn primary" id="reveal">${st.revealed ? 'Hide mark scheme' : 'Show mark scheme'}</button>
        <span class="spacer"></span>
        <span class="hint score">Your mark <b id="score">${got}</b>/${total}</span>
      </div>
      ${revealHtml}
    </div>
    ${sidePanel(q.ch, 'short')}
    </div>
    ${msBlock}`;

  $('#chSel').onchange = e => {
    const d = st.drafts || {};
    S.short = { pool: shortPool(e.target.value), i:0, revealed:false, checks:{}, chap:e.target.value, drafts:d, self: st.self || {} };
    renderShort();
  };
  $('#reshuffle').onclick = () => {
    const d = st.drafts || {};
    S.short = { pool: shuffle(items), i:0, revealed:false, checks:{}, chap:st.chap, drafts:d, self: st.self || {} };
    renderShort();
  };
  $('#sa').oninput = e => { st.drafts = st.drafts || {}; st.drafts[q.id] = e.target.value; };
  $('#reveal').onclick = () => { st.revealed = !st.revealed; renderShort(); };
  if (st.revealed){
    $('#view').querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
      st.checks[q.id] = st.checks[q.id] || {};
      st.checks[q.id][+cb.dataset.i] = cb.checked;
      const g = (q.pts||[]).reduce((s,p,i)=>s+(st.checks[q.id][i]?p.s:0),0);
      $('#score').textContent = g;
    });
    if ($('#sm')){
      $('#sm').oninput = e => {
        const v = Math.max(0, Math.min(total, Math.round(+e.target.value || 0)));
        st.self[q.id] = v;
        $('#score').textContent = v;
      };
    }
    $('#save').onclick = () => {
      const g = hasPts
        ? (q.pts||[]).reduce((s,p,i)=>s+(st.checks[q.id]&&st.checks[q.id][i]?p.s:0),0)
        : Math.max(0, Math.min(total, Math.round(+($('#sm') ? $('#sm').value : 0))));
      attemptScore(q.id, total ? g/total : 0);
      toast(`Saved ${g}/${total} — ${g >= total * 0.7 ? 'marked as mastered' : 'added to review'}`);
      st.i = (st.i + 1) % st.pool.length; st.revealed = false; renderShort();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    $('#nextq').onclick = () => { st.i = (st.i + 1) % st.pool.length; st.revealed = false; renderShort(); };
  }
}

/* ================= QUESTION BANK ================= */
function renderManage(){
  if (!S.manage) S.manage = { q:'', type:'all', chap:'all' };
  const m = S.manage;
  let items = bank.filter(q =>
    (m.type === 'all' || q.type === m.type) &&
    (m.chap === 'all' || q.ch === m.chap) &&
    (!m.q || ((q.q || q.front || '') + ' ' + (q.src || '')).toLowerCase().includes(m.q.toLowerCase()))
  );
  const TO = { mcq:0, card:1, short:2 };
  items.sort((a,b) => (CHAP_ORDER.indexOf(a.ch) - CHAP_ORDER.indexOf(b.ch)) || (TO[a.type] - TO[b.type]));

  const admin = isAdmin();
  $('#view').innerHTML = `
    <h2 class="view-t">Question bank</h2>
    <p class="view-sub">${bank.length} questions · ${connected() ? (admin ? 'shared bank, admin editing' : 'shared bank, read-only') : (admin ? 'local bank, admin editing on this device' : 'not connected')} · updated ${fmtTime(meta.ts)}</p>

    ${admin ? `
    <div class="tools">
      <button class="tool" id="add">${svg('plus')}New question</button>
      <button class="tool" id="export">${svg('down')}Export JSON</button>
      <button class="tool" id="import">${svg('up')}Import</button>
      <button class="tool" id="rebuild">${svg('sync')}Rebuild from notes</button>
    </div>` : `
    <div class="note" style="margin-bottom:14px"><b>Read-only.</b> ${signedIn()
      ? 'Signed in as a student — ask the admin to add or change questions.'
      : 'Guest mode. Sign in as the admin to import, edit or delete questions.'}</b> You can still practise everything.</div>
    <div class="row" style="margin-bottom:14px"><button class="btn sm" id="manage-in">${signedIn() ? 'Switch to the admin account' : 'Sign in'}</button></div>`}

    <div class="searchrow">
      <input type="search" id="q" placeholder="Search a question or term" value="${esc(m.q)}">
      <select id="type">
        <option value="all"${m.type==='all'?' selected':''}>All types</option>
        <option value="mcq"${m.type==='mcq'?' selected':''}>Multiple choice</option>
        <option value="card"${m.type==='card'?' selected':''}>Flashcards</option>
        <option value="short"${m.type==='short'?' selected':''}>Short answers</option>
      </select>
      <select id="chap">
        <option value="all"${m.chap==='all'?' selected':''}>All chapters</option>
        ${CHAP_ORDER.map(c => `<option value="${c}"${m.chap===c?' selected':''}>${c} ${esc(CHAP_NAMES[c])}</option>`).join('')}
      </select>
    </div>

    <div class="hint" style="margin-bottom:8px">${items.length} items</div>
    <div class="list two">${items.map(q => `
      <div class="item">
        <div class="body">
          <div class="qt">${esc(q.type === 'card' ? q.front : q.q)}</div>
          <div class="mt">${[TYPE_NAME[q.type], q.ch + ' ' + esc(CHAP_NAMES[q.ch]||''), q.t ? esc(q.t) : '', pOf(q.id).n ? 'practised ' + pOf(q.id).n + '×' : 'not practised'].filter(Boolean).join('<span style="opacity:.4">·</span>')}</div>
        </div>
        <div class="acts">${admin ? `
          <button class="iconbtn" data-edit="${q.id}" aria-label="Edit">${svg('edit')}</button>
          <button class="iconbtn" data-del="${q.id}" aria-label="Delete">${svg('trash')}</button>` : ''}
        </div>
      </div>`).join('') || '<div class="empty">Nothing matches those filters.</div>'}
    </div>

    <div class="row" style="margin-top:16px">
      ${admin ? `<button class="btn ghost sm" id="reset">${svg('reset')}Restore built-in bank</button>` : ''}
      <span class="spacer"></span>
      ${signedIn() ? `<button class="btn ghost sm" id="wipe">Clear my practice history</button>` : ''}
    </div>

    <div class="note">
      <b>How updates reach everyone.</b> ${admin
        ? (connected()
            ? 'You are the admin: every import, edit or delete is written to the shared cloud bank, so all visitors see the new version on their next load. Students can practise the same questions but cannot change them.'
            : 'Local admin mode: every import, edit or delete is saved in this browser. Connect a backend and sign in to publish the bank, so other devices and students see it.')
        : 'The bank lives in the cloud and is readable by every visitor, so new material appears here as soon as the admin publishes it. Only the admin account can add or change questions.'}<br>
      ${signedIn() ? 'Your answers are saved against your account — sign in on a phone or iPad and the same progress is there.' : 'Nothing is saved while you are a guest; sign in first if you want the record to follow you.'}
    </div>
  `;

  $('#q').oninput = e => { m.q = e.target.value; renderManage(); setTimeout(()=>{ const el=$('#q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); },0); };
  $('#type').onchange = e => { m.type = e.target.value; renderManage(); };
  $('#chap').onchange = e => { m.chap = e.target.value; renderManage(); };
  const on = (sel, fn) => { const el = $('#view').querySelector(sel); if (el) el.onclick = fn; };
  if ($('#manage-in')) $('#manage-in').onclick = authDialog;
  on('#add', () => editDialog(null));
  $('#view').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editDialog(bank.find(q => q.id === b.dataset.edit)));
  $('#view').querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const q = bank.find(x => x.id === b.dataset.del);
    if (!q) return;
    if (confirm('Delete this question? It disappears for everyone on the next load.')) {
      bank = bank.filter(x => x.id !== q.id);
      delete prog[q.id];
      persistBank('Edited by admin'); persistProg(); toast('Deleted'); renderManage();
    }
  });
  on('#export', exportBank);
  on('#import', importBank);
  on('#rebuild', rebuildDialog);
  on('#reset', () => {
    if (!confirm('Replace the current bank with the built-in one? Your edits will be lost, so export first if unsure.')) return;
    bank = clone(BUILTIN); persistBank('Built-in bank'); toast('Built-in bank restored'); renderManage();
  });
  on('#wipe', () => {
    if (!confirm('Clear your practice history? Questions are not affected.')) return;
    prog = {}; persistProg();
    if (signedIn()) clearCloudProgress();
    toast('Practice history cleared'); renderManage();
  });
}

/* ---------- dialogs ---------- */
function modal(html){
  const m = $('#modal');
  m.hidden = false;
  document.body.style.overflow = 'hidden';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.onclick = e => { if (e.target === m) closeModal(); };

function closeModal(){
  const m = $('#modal');

  document.body.style.overflow = '';
}

function authDialog(){
  const ok = connected();
  modal(`
    <h3>Save your progress</h3>
    <p class="hint">Practising needs no account. As a guest, answers stay in this tab and disappear when it closes. Signing in keeps the record — and lets an admin edit the bank.</p>
    ${ok ? '' : `<div class="note" style="margin:10px 0"><b>Backend not connected.</b> Accounts need a Supabase project. Set it up once, then everyone's progress follows their account on any device.</div>`}
    <div class="field" style="margin-top:10px"><label>Email</label><input type="email" id="a-mail" autocomplete="username" placeholder="you@school.edu"></div>
    <div class="field"><label>Password</label><input type="password" id="a-pass" autocomplete="current-password"></div>
    <div class="row">
      <button class="btn primary" id="a-in"${ok ? '' : ' disabled'}>Sign in</button>
      <button class="btn" id="a-up"${ok ? '' : ' disabled'}>Create account</button>
    </div>
    <p class="hint" id="a-note"></p>
    ${PUBLIC_BUILD ? `<div class="note" style="margin:10px 0">Editing is disabled on this public copy. Only the owner's account can change the bank, and only through the connected backend.</div>` : `<div class="field" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <label>Admin passphrase</label>
      <input type="password" id="a-owner" placeholder="enter the admin passphrase" autocomplete="off">
      <div class="hint" style="margin-top:5px">No account needed. The passphrase unlocks import and editing on this device; the account above is only for saving progress.</div>
    </div>
    <div class="row"><button class="btn" id="a-unlock">Enter as admin</button></div>`}
    <div class="row" style="margin-top:8px">
      <button class="btn ghost sm" id="a-setup">${ok ? 'Backend settings' : 'Connect backend'}</button>
      <span class="spacer"></span>
      <button class="btn ghost sm" id="a-cancel">Continue as guest</button>
    </div>
  `);
  $('#a-cancel').onclick = closeModal;
  $('#a-setup').onclick = backendDialog;
  const run = async fn => {
    const mail = $('#a-mail').value.trim(), pass = $('#a-pass').value;
    const note = $('#a-note');
    if (!mail || !pass) { note.textContent = 'Email and password are both needed.'; return; }
    note.textContent = 'Please wait…';
    try { await fn(mail, pass); }
    catch (e){ note.textContent = e.message; }
  };
  $('#a-in').onclick = () => run(signIn);
  $('#a-up').onclick = () => run(signUpAccount);
  const enterAdmin = () => {
    const val = $('#a-owner').value.trim(), note = $('#a-note');
    if (!val){ note.textContent = 'Type the admin passphrase first.'; return; }
    if (val !== OWNER_PASS){ note.textContent = 'That passphrase is not right.'; return; }
    ownerRec = ownerRec && ownerRec.hash === ownerStamp(OWNER_PASS) ? ownerRec : { hash: ownerStamp(OWNER_PASS), ts: Date.now() };
    save(LS_OWNER, ownerRec);
    closeModal(); paintAcct(); render(); toast('Admin mode on for this device');
  };
  if ($('#a-unlock')) $('#a-unlock').onclick = enterAdmin;
  if ($('#a-owner')) $('#a-owner').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); enterAdmin(); } };
}

const SCHEMA_SQL = [
  '-- 9708 self-check · run once in Supabase → SQL editor',
  'create table if not exists public.items (',
  '  id text primary key, type text not null, ch text, t text,',
  '  q text, o jsonb, a int, e text, front text, back text, note text,',
  '  pts jsonb, model text, src text, img text, updated_at timestamptz default now());',
  'alter table public.items add column if not exists src text;',
  'alter table public.items add column if not exists img text;',
  '',
  'create table if not exists public.progress (',
  '  user_id uuid references auth.users on delete cascade,',
  '  item_id text, n int default 0, r int default 0, w int default 0,',
  '  box int default 0, ts bigint default 0,',
  '  primary key (user_id, item_id));',
  '',
  'create table if not exists public.profiles (',
  '  id uuid primary key references auth.users on delete cascade,',
  '  email text, role text not null default \'student\');',
  '',
  'create or replace function public.is_admin() returns boolean',
  'language sql stable security definer as $$',
  '  select exists (select 1 from public.profiles p where p.id = auth.uid() and p.role = \'admin\');',
  '$$;',
  '',
  'alter table public.items enable row level security;',
  'alter table public.progress enable row level security;',
  'alter table public.profiles enable row level security;',
  '',
  'create policy items_read on public.items for select using (true);',
  'create policy items_admin_ins on public.items for insert with check (public.is_admin());',
  'create policy items_admin_upd on public.items for update using (public.is_admin()) with check (public.is_admin());',
  'create policy items_admin_del on public.items for delete using (public.is_admin());',
  '',
  'create policy prog_read on public.progress for select using (user_id = auth.uid() or public.is_admin());',
  'create policy prog_ins on public.progress for insert with check (user_id = auth.uid());',
  'create policy prog_upd on public.progress for update using (user_id = auth.uid()) with check (user_id = auth.uid());',
  '',
  'create policy prof_read on public.profiles for select using (id = auth.uid() or public.is_admin());',
  'create policy prof_admin on public.profiles for all using (public.is_admin()) with check (public.is_admin());',
  '',
  '-- the first account to sign up becomes the admin',
  'create or replace function public.handle_new_user() returns trigger',
  'language plpgsql security definer as $$',
  'declare n int;',
  'begin',
  '  select count(*) into n from public.profiles where role = \'admin\';',
  '  insert into public.profiles (id, email, role)',
  '  values (new.id, new.email, case when n = 0 then \'admin\' else \'student\' end)',
  '  on conflict (id) do nothing;',
  '  return new;',
  'end; $$;',
  '',
  'drop trigger if exists on_auth_user_created on auth.users;',
  'create trigger on_auth_user_created after insert on auth.users',
  '  for each row execute function public.handle_new_user();'
].join('\n');

function backendDialog(){
  const cur = backend || { url:'', key:'' };
  modal(`
    <h3>Backend · Supabase</h3>
    <p class="hint">Set up once. After that anyone can sign in and their progress follows them across devices; the first account created becomes the admin.</p>

      <textarea id="b-sql" readonly style="min-height:150px;font-size:11.5px">${esc(SCHEMA_SQL)}</textarea></div>
    <div class="row"><button class="btn sm" id="b-copy">Copy SQL</button><span class="hint">Then in Authentication → Providers, switch “Confirm email” off so sign-up is instant.</span></div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="b-save">Save and connect</button>
      ${connected() ? '<button class="btn" id="b-off">Disconnect</button>' : ''}
      <button class="btn ghost" id="b-cancel">Close</button>
    </div>
    <p class="hint" id="b-note"></p>
  `);
  $('#b-cancel').onclick = closeModal;
  $('#b-copy').onclick = () => {
    const ta = $('#b-sql');
    ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(SCHEMA_SQL) : Promise.resolve())
      .then(() => toast('SQL copied')).catch(() => toast('Select the text and copy it'));
  };
  $('#b-save').onclick = async () => {
    const url = $('#b-url').value.trim().replace(/\/$/, '');
    const key = $('#b-key').value.trim();
    const note = $('#b-note');
    if (!/^https:\/\/.+\.supabase\.co$/.test(url) || key.length < 20){
      note.textContent = 'That looks incomplete — the URL ends in .supabase.co and the key is the long anon string.';
      return;
    }
    note.textContent = 'Connecting…';
    backend = { url, key }; save(LS_BACKEND, backend);
    sb = null;
    try {

/* ---------- import: JSON, PDF or pasted text ---------- */
function detectChapter(s){
  const t = ' ' + String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  let best = { ch:'?', score:0 };
  CHAP_ORDER.forEach(c => {
    if (c === '?') return;
    let sc = 0;
    (CHAP_HINTS[c] || []).forEach(ph => {
      const words = ph.split(' ').length;
      if (t.indexOf(' ' + ph + ' ') >= 0) sc += words + (words > 1 ? 0.5 : 0);
    });
    if (sc > best.score) best = { ch:c, score:sc };
  });
  return best;
}

async function pdfToText(file){
  if (!window.pdfjsLib){
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('the PDF reader did not load'));
      document.head.appendChild(s);
    });
  }
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = 'https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for (let p = 1; p <= doc.numPages; p++){
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const rows = {}, order = [];
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const y = Math.round(it.transform[5] / 3) * 3;
      if (!rows[y]) { rows[y] = []; order.push(y); }
      rows[y].push(it);
    });
    order.sort((a, b) => b - a);
    order.forEach(y => {
      const line = rows[y].sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
      if (line) out.push(line);
    });
    out.push('');
  }
  return out.join('\n');
}

let lastParse = { total:0, noAnswer:0 };

/* pull answers out of a separate answer paper / mark scheme */
function parseAnswerKey(text){
  const byNum = {}, seq = [];
  String(text || '').split(/\r?\n/).forEach(raw => {
    let l = raw.replace(/\u00a0/g, ' ').replace(/\|/g, ' ').replace(/\s+/g, ' ').trim();
    if (!l) return;
    if (/^(answers?|answer key|key|mark scheme|correct answers|solution)s?\s*$/i.test(l)) return;
    if (/^(answers?|answer key|key|mark scheme|correct answers)\.{0,3}\s*$/i.test(l)) return;
    const pairs = l.match(/(?:^|[^A-Za-z])(\d{1,3})\s*[.)\-–:]*\s*(?:option\s*)?([A-D])/gi);
    if (pairs && pairs.length){
      pairs.forEach(p => {
        const m = p.match(/(\d{1,3})\s*[.)\-–:]*\s*(?:option\s*)?([A-D])/i);
        if (m) byNum[+m[1]] = m[2].toUpperCase();
      });
      return;
    }
    if (/^[A-D]$/i.test(l)) seq.push(l.toUpperCase());
  });
  return { byNum, seq };
}

function parseItems(text, chMode, answerKey){
  const lines = text.split(/\r?\n/).map(l => l.replace(/\u00a0/g, ' ').trim());
  const key = {};
  const seq = [];
  if (answerKey && answerKey.byNum) Object.keys(answerKey.byNum).forEach(n => { key[n] = answerKey.byNum[n]; });
  if (answerKey && answerKey.seq && answerKey.seq.length) seq.push(...answerKey.seq);
  const readKey = l => {
    (l.match(/(?:q|question)?\s*(\d{1,3})\s*[.)\-–:]?\s*\(?([A-D])\)?/gi) || []).forEach(m => {
      const mm = m.match(/(\d{1,3})\s*[.)\-–:]?\s*\(?([A-D])/i);
      if (mm) key[+mm[1]] = mm[2].toUpperCase();
    });
  };
  lines.forEach(l => {
    if (!l) return;
    const header = /^[\s]*(answers?|answer key|key|mark scheme|correct answers)[\s:.]/i.test(l);
    const inlineKey = /^\s*(\d{1,3}\s*[-–:.)]?\s*[A-D]\b[\s,;/]+){3,}/i.test(l);
    const single = /^\(?\s*(?:q|question)?\s*(\d{1,3})\s*[.)\-–:]?\s*\(?([A-D])\)?\s*$/i.test(l);
    if (!header && !inlineKey && !single) return;
    readKey(l);
  });

  const startRe = /^(\d{1,3})\s*[.)]\s*(.+)$/;
  const optRe = /^\(?([A-Da-d])[.)]\s*(.+)$/;
  const blocks = [];
  let cur = null;
  lines.forEach(l => {
    if (!l) return;
    if (/^(answers?|answer key|key|mark scheme|correct answers)\b/i.test(l)) return;
    const ms = l.match(startRe);
    if (ms && (!cur || cur.opts.length > 1 || cur.answer || cur.exp)){
      cur = { num: +ms[1], stem: [ms[2]], opts: [], answer: '', exp: '' };
      blocks.push(cur); return;
    }
    if (!cur) return;
    const mo = l.match(optRe);
    if (mo) { cur.opts.push({ k: mo[1].toUpperCase(), t: mo[2].trim() }); return; }
    const ma = l.match(/^(?:correct answer|answer|ans)\s*[:\-–]?\s*\(?([A-D])\)?(.*)$/i);
    if (ma) { cur.answer = ma[1].toUpperCase(); return; }
    const me = l.match(/^(?:explanation|reason|why|comment)\s*[:\-–]\s*(.+)$/i);
    if (me) { cur.exp = (cur.exp ? cur.exp + ' ' : '') + me[1]; return; }
    if (cur.exp) cur.exp += ' ' + l;
    else if (!cur.opts.length) cur.stem.push(l);
    else cur.exp = l;
  });

  const field = (stem, opts) => {
    if (chMode && chMode !== 'auto') return chMode;
    const q = detectChapter(stem);
    if (q.score > 0) return q.ch;
    return detectChapter(stem + ' ' + (opts || '')).ch;
  };

  /* a key that is only a column of letters is matched to questions in number order */
  const seqKey = {};
  if (seq.length){
    const nums = blocks.filter(b => b.opts.length >= 2).map(b => b.num).sort((a, b) => a - b);
    nums.forEach((n, i) => { if (seq[i]) seqKey[n] = seq[i]; });
  }

  const mcq = [];
  let noAnswer = 0;
  blocks.forEach(b => {
    if (b.opts.length < 2) return;
    const ans = b.answer || key[b.num] || seqKey[b.num];
    if (!ans) { noAnswer++; return; }
    const idx = b.opts.findIndex(o => o.k === ans);
    const stem = b.stem.join(' ').replace(/\s+/g, ' ').trim();
    mcq.push({
      id: uid(), type: 'mcq', t: '',
      ch: field(stem, b.opts.map(o => o.t).join(' ')),
      q: stem,
      o: b.opts.map(o => o.t),
      a: idx >= 0 ? idx : 0,
      e: b.exp.trim()
    });
  });

  const cards = [];
  if (!mcq.length){
    parseDefTable(text).forEach(r => cards.push({ id: uid(), type: 'card', t: '', ch: field(r.front + ' ' + r.back), front: r.front, back: r.back, note: r.note }));
  }
  lastParse = { total: mcq.length + cards.length, noAnswer };
  return mcq.concat(cards);
}

function rebuildDialog(){
  if (!isAdmin()){ toast(connected() ? 'Only the admin account can change the bank' : 'Connect the backend and sign in as admin to edit the bank'); return; }
  modal(`
    <h3>Rebuild flashcards from notes</h3>
    <p class="hint">Paste the definition table from the notes. Each row becomes one card; a card with the same front is updated rather than duplicated.</p>
    <div class="field" style="margin-top:12px"><textarea id="f-md" style="min-height:170px" placeholder="| Term | Exam-ready definition | Note |
| --- | --- | --- |
| Scarcity | Wants are unlimited but resources are limited. | Relative concept |
| PPC | ... | ... |"></textarea></div>
    <div class="field"><label>Chapter for these cards</label><select id="f-ch2">${CHAP_ORDER.map(c=>`<option value="${c}">${c} ${esc(CHAP_NAMES[c])}</option>`).join('')}</select></div>
    <div class="row"><button class="btn primary" id="do-rebuild">Parse and merge</button><button class="btn" id="cancel3">Cancel</button></div>
  `);
  $('#cancel3').onclick = closeModal;
  $('#do-rebuild').onclick = () => {
    const text = $('#f-md').value;
    const ch = $('#f-ch2').value;
    const rows = parseDefTable(text);
    if (!rows.length) return toast('Nothing parsed — check that the lines are pipe-separated');
    let added = 0, updated = 0;
    rows.forEach(r => {
      const exist = bank.find(x => x.type === 'card' && x.front.trim() === r.front.trim());
      if (exist) { exist.back = r.back; if (r.note) exist.note = r.note; exist.ch = ch; updated++; }
      else { bank.push({ id: uid(), type:'card', ch, t:'', front:r.front, back:r.back, note:r.note }); added++; }
    });
    persistBank('Rebuilt from notes'); closeModal(); toast(`Added ${added}, updated ${updated}`); renderManage();
  };
}

function parseDefTable(text){
  const out = [];
  text.split('\n').forEach(line => {
    let t = line.trim();
    if (!t) return;
    if (t.startsWith('|')) {
      const cells = t.replace(/^\|/, '').replace(/\|$/, '').split('|').map(s => s.trim().replace(/\*\*/g, ''));
      if (cells.length < 2) return;
      if (cells.join('').replace(/[-: ]/g, '') === '') return;
      if (/term|definition|note|术语/i.test(cells[0]) && /definition|note|定义|提醒/i.test(cells[1])) return;
      out.push({ front: cells[0], back: cells[1], note: cells[2] || '' });
    } else if (/^[^:：]{1,40}[:：]/.test(t)) {
      const i = t.search(/[:：]/);
      out.push({ front: t.slice(0, i).trim(), back: t.slice(i + 1).trim(), note: '' });
    }
  });
  return out.filter(r => r.front && r.back);
}
