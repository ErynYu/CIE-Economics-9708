<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1312" media="(prefers-color-scheme: dark)">
<title>9708 Economics — Knowledge Self-Check</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F6B52'/%3E%3Cpath d='M9 8h9a4 4 0 014 4v12H13a4 4 0 00-4 4V8z' fill='%23FBFAF6'/%3E%3Cpath d='M13 13h6M13 17h5' stroke='%230F6B52' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Source+Serif+4:opsz,wght@8..60,400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
:root{
  --paper:#FBFAF6; --card:#FFFFFF; --ink:#171F1C; --muted:#6C7A73;
  --line:#E4E0D5; --green:#0F6B52; --green-soft:#E9F2EE; --green-line:var(--green-line); --green-hover:#0C5B45;
  --amber:#A9762F; --amber-soft:#FAF1E1;
  --red:#A83A2C; --red-soft:#FBEBE8; --red-line:var(--red-line);
  --text-2:#3B4741; --track:#EFEBE0; --track-2:#EAE6DA; --note-bg:#FDFCF7; --hover:#FCFDFB;
  --line-strong:#DCD6C7; --off:#C9C2AD; --face-back:#FDFCF8;
  --src-bg:#F4F1E7; --src-ink:#8A8578; --src-line:#E4DFD0;
  --rail-bg:#F7F4EA; --rail-hover:#EFEBDE; --rail-badge-ink:var(--rail-badge-ink);
  --on-accent:#FFFFFF; --toast-bg:#171F1C; --toast-ink:#FBF8F0;
  --glass:var(--glass); --glass-2:var(--glass-2); --scrim:var(--scrim);
  --shadow:0 1px 2px rgba(23,31,28,.05),0 12px 32px rgba(23,31,28,.05);
  --serif:"Source Serif 4","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1312; --card:#171C1A; --ink:#E6E3D9; --muted:#94A099;
    --line:#2A312D; --green:#5CBF9B; --green-soft:#1A2723; --green-line:#2F5748; --green-hover:#74CFAD;
    --amber:#D9A55F; --amber-soft:#2B2317;
    --red:#E08C7B; --red-soft:#2E1E1A; --red-line:#5A3630;
    --text-2:#C8CEC7; --track:#232A26; --track-2:#232A26; --note-bg:#171D1A; --hover:#1D2421;
    --line-strong:#3A433D; --off:#5B635D; --face-back:#191F1C;
    --src-bg:#1E2521; --src-ink:#909C95; --src-line:#2C3530;
    --rail-bg:#131817; --rail-hover:#212825; --rail-badge-ink:rgba(15,19,18,.72);
    --on-accent:#0B1210; --toast-bg:#E6E3D9; --toast-ink:#121613;
    --glass:rgba(15,19,18,.9); --glass-2:rgba(15,19,18,.94); --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.28);
  }
  body{-webkit-font-smoothing:auto}
}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:15px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600}

/* ---------- shell ---------- */
.app{min-height:100vh}
.rail{display:none}
.col{min-width:0}
main{padding:20px 18px 96px;max-width:940px;margin:0 auto}

.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand .bt{display:block;font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.25;letter-spacing:.01em;white-space:nowrap}
.brand .bs{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

.topbar{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:940px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 18px}
.count{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.acct{display:flex;align-items:center}
.acct button{font:inherit;font-size:11.5px;color:var(--green);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 10px;display:flex;align-items:center;gap:6px;cursor:pointer}
.acct button:hover{border-color:var(--green)}
.acct .who{background:var(--green);color:var(--on-accent);border-color:var(--green)}
.acct .who .r{opacity:.75;font-size:10.5px}
.acct .gem{width:6px;height:6px;border-radius:50%;background:var(--off)}
.acct .ga{background:var(--off)}
.acct button{white-space:nowrap}
@media (max-width:520px){
  .topbar-in{gap:8px;padding:10px 14px}
  .count{display:none}
  .brand .bs{display:none}
}

/* tab bar: phone = fixed bottom; tablet = inline horizontal */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass-2);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:940px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:10.5px;color:var(--muted)}
.tab svg{width:19px;height:19px;stroke:var(--muted)}
.tab.on{color:var(--green)}
.tab.on svg{stroke:var(--green)}
.tab .ln{display:none}
.tab .sn{display:inline}
.keyhint{display:none}
.badge{font-size:9px;background:var(--green);color:var(--on-accent);border-radius:7px;padding:0 4px;line-height:14px;margin-left:3px;vertical-align:middle}

/* ---------- type ---------- */
.view-t{font-size:24px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
.view-sub{font-size:13px;color:var(--muted);margin:0 0 18px;max-width:62ch}
h3{font-size:15px;margin:0;letter-spacing:.01em}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:18px}

/* ---------- home ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.modes{display:grid;grid-template-columns:1fr;gap:10px}
.mode{display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 15px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--green-line)}
.mode:active{transform:scale(.99)}
.mode .mt{font-family:var(--serif);font-weight:600;font-size:16px;display:flex;align-items:center;gap:9px}
.mode .mi{width:30px;height:30px;border-radius:8px;background:var(--green-soft);display:grid;place-items:center;flex:none}
.mode .mi svg{width:17px;height:17px;stroke:var(--green)}
.mode .md{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 8px;gap:10px}
.sect-h small{font-size:11px;color:var(--muted)}
.chapters3{display:grid;gap:0 24px}
.chap{display:flex;align-items:center;gap:10px;min-width:0;padding:7px 0;border-bottom:1px dashed var(--line)}
.chap:last-child{border-bottom:0}
.chap .cname{font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap .cbar{width:64px;height:4px;background:var(--track);border-radius:4px;flex:none;overflow:hidden}
.chap .cbar i{display:block;height:100%;background:var(--green);border-radius:4px}
.chap .cnum{font-size:11px;color:var(--muted);width:38px;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:16px;padding:13px 14px;border:1px dashed var(--line);border-radius:11px;background:var(--note-bg)}

/* ---------- chips / progress ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 18px 12px 0;margin-right:-18px;scrollbar-width:none;flex-wrap:nowrap}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12px;padding:6px 11px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.chip:hover{border-color:var(--green-line)}
.chip.on{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.filterbar{display:flex;align-items:center;gap:9px;margin:0 0 12px;flex-wrap:nowrap}
.filterbar label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.filterbar select{width:auto;max-width:300px;min-width:120px;flex:0 1 300px}
.study{display:block}
.side{display:none}
.side-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.side-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.side-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0}
.side-row b{font-family:var(--serif);font-size:14px}
.side-bar{height:4px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:8px}
.side-bar i{display:block;height:100%;background:var(--green)}
.side-tips p{font-size:12.5px;line-height:1.6;color:var(--text-2);margin:0 0 9px}
.side-tips p:last-child{margin-bottom:0}
.pbar{height:3px;background:var(--track-2);border-radius:4px;overflow:hidden;margin:0 0 16px}
.pbar i{display:block;height:100%;background:var(--green);transition:width .25s}

/* ---------- question ---------- */
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 8px;border-radius:5px;background:var(--green-soft);color:var(--green);letter-spacing:.03em}
.qimg{display:block;max-width:100%;height:auto;margin:12px 0 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:6px}
.srctag{font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:10.5px;letter-spacing:.02em;color:var(--src-ink);background:var(--src-bg);border:1px solid var(--src-line);border-radius:5px;padding:2px 6px}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.qtext{font-family:var(--serif);font-size:18px;line-height:1.65;margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;line-height:1.55;transition:background .12s,border-color .12s}
.opt:hover{border-color:var(--green-line);background:var(--hover)}
.opt .k{width:21px;height:21px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none;margin-top:1px}
.opt.good{background:var(--green-soft);border-color:var(--green-line)}
.opt.good .k{background:var(--green);color:var(--on-accent);border-color:var(--green)}
.opt.bad{background:var(--red-soft);border-color:var(--red-line)}
.opt.bad .k{background:var(--red);color:var(--on-accent);border-color:var(--red)}
.opt[disabled]{opacity:1;cursor:default}
.fb{margin-top:16px;border-radius:11px;padding:14px 15px;font-size:13.5px;line-height:1.65;background:var(--green-soft);border:1px solid var(--green-line)}
.fb.bad{background:var(--red-soft);border-color:var(--red-line)}
.fb .fbt{font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.fb .fbt.ok{color:var(--green)}
.fb .fbt.no{color:var(--red)}

.row{display:flex;gap:9px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:9px;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--card);transition:background .12s,border-color .12s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:15px;height:15px;flex:none}
.btn:hover{border-color:var(--green-line)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn.primary:hover{background:var(--green-hover)}
.btn.ghost{color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.hint{font-size:11.5px;color:var(--muted)}
.kbd{font-family:var(--sans);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--muted);background:var(--card)}

/* ---------- flashcards ---------- */
.flipwrap{perspective:1600px;margin:4px 0 12px}
.flip{position:relative;min-height:264px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.1,.2,1);cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);padding:26px 24px;display:flex;flex-direction:column;justify-content:center}
.face.back{transform:rotateY(180deg);background:var(--face-back)}
.face .fl{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.face .fw{font-family:var(--serif);font-size:26px;line-height:1.35;font-weight:600;word-break:break-word}
.face .fd{font-size:14.5px;line-height:1.7;margin-top:6px}
.face .fn{font-size:11.5px;color:var(--muted);margin-top:12px;border-top:1px dashed var(--line);padding-top:9px}
.tapnote{text-align:center;font-size:11px;color:var(--muted);margin:2px 0 0}

/* ---------- short answers ---------- */
.sa-q{font-family:var(--serif);font-size:17px;line-height:1.6;margin:6px 0 14px}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--sans);font-size:14px;line-height:1.65;resize:vertical;background:var(--card);color:var(--ink)}
textarea:focus{outline:none;border-color:var(--green)}
.model{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.msbox{margin-top:18px}
.mslink{display:block;margin:8px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.mslink:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.msimg{display:block;width:100%;height:auto;mix-blend-mode:normal}
.selfmark{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:var(--sans)}
.selfmark input{width:64px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--card);color:var(--ink);font-size:13px;font-family:var(--sans)}

.model h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin:0 0 6px;font-weight:600;font-family:var(--sans)}
.model p{font-size:13.5px;line-height:1.75;margin:0 0 12px;color:var(--text-2)}
.pts{display:grid;gap:7px}
.pt{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.55;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.pt input{width:16px;height:16px;accent-color:var(--green);margin:2px 0 0;flex:none}
.pt .sc{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.score{font-size:12.5px;color:var(--muted)}
.score b{color:var(--green);font-size:15px;font-family:var(--serif)}

/* ---------- question bank ---------- */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tool{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:12.5px;text-align:left}
.tool:hover{border-color:var(--green-line)}
.tool svg{width:16px;height:16px;stroke:var(--green);flex:none}
.searchrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.searchrow input{grid-column:1/-1}
input[type=file]{width:100%;font-size:12.5px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:9px;padding:10px}
input[type=file]::file-selector-button{margin-right:10px;padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-family:inherit;font-size:12px;color:var(--ink)}
input[type=text],input[type=search],select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--sans);font-size:13px;background:var(--card);color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--green)}
.list{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.item:hover{border-color:var(--line-strong)}
.item .body{flex:1;min-width:0}
.item .qt{font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .mt{font-size:10.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.item .acts{display:flex;gap:4px;flex:none}
.iconbtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card)}
.iconbtn:hover{border-color:var(--green-line)}
.iconbtn svg{width:14px;height:14px;stroke:var(--muted)}
.empty{padding:32px 18px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--paper);width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 18px 24px}
.sheet h3{font-size:18px;margin:0 0 14px}
.sheet textarea{min-height:84px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--sans);font-size:14px;background:var(--card);color:var(--ink)}

.preview{margin:6px 0 4px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--card)}
.pv{font-size:12.5px;line-height:1.5;padding:3px 0;color:var(--text-2)}
.pv b{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-right:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:78px;background:var(--toast-bg);color:var(--toast-ink);font-size:12.5px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- tablet ---------- */
@media (min-width:721px){
  main{padding:28px 32px 80px;max-width:820px}
  .topbar-in{padding:14px 32px;max-width:820px}
  .tabs{position:sticky;top:0;border-top:0;border-bottom:1px solid var(--line);padding:0}
  .chips{flex-wrap:wrap;overflow:visible;padding-right:0;margin-right:0}
  .tabs-in{display:flex;gap:4px;padding:0 28px;max-width:820px}
  .tab{flex-direction:row;gap:7px;padding:11px 14px;font-size:12.5px;border-bottom:2px solid transparent}
  .tab .ln{display:inline}
  .tab .sn{display:none}
  .keyhint{display:inline}
  .tab.on{border-bottom-color:var(--green)}
  .tab svg{width:16px;height:16px}
  .view-t{font-size:27px}
  .stats{grid-template-columns:repeat(4,1fr);gap:12px}
  .stat b{font-size:28px}
  .modes{grid-template-columns:1fr 1fr}
  .chapters3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tools{grid-template-columns:repeat(4,1fr)}
  .searchrow{grid-template-columns:2fr 1fr 1fr}
  .searchrow input{grid-column:auto}
  .qtext{font-size:20px}
  .opt{font-size:15px;padding:14px 16px}
  .face .fw{font-size:30px}
  .flip{min-height:320px}
}
/* ---------- desktop ---------- */
@media (min-width:1060px){
  .app{display:grid;grid-template-columns:268px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;padding:30px 26px;
    background:var(--rail-bg);border-right:1px solid var(--line)}
  .rail .brand{margin-bottom:6px}
  .rail .brand .bt{font-size:18px}
  .railnav{display:flex;flex-direction:column;gap:3px}

  .railnav a svg{width:17px;height:17px;stroke:var(--muted);flex:none}
  .railnav a:hover{background:var(--rail-hover)}
  .railnav a.on{background:var(--green);color:var(--on-accent)}
  .railnav a.on svg{stroke:var(--on-accent)}
  .railnav .rbadge{margin-left:auto;font-size:10.5px;color:var(--muted)}
  .railnav a.on .rbadge{color:var(--rail-badge-ink)}
  .railfoot{margin-top:auto;font-size:11px;color:var(--muted);line-height:1.7;border-top:1px dashed var(--line);padding-top:14px}
  .railfoot b{display:block;color:var(--ink);font-family:var(--serif);font-size:13px;margin-bottom:2px}
  .topbar,.tabs{display:none}
  main{padding:44px 56px 90px;max-width:980px;margin:0 auto}
  .view-t{font-size:30px}
  .chapters3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .study{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:24px;align-items:start}

  .modes{grid-template-columns:1fr 1fr}

  .chap{gap:8px}

.chap .cname{font-size:11.5px}

  .face .fw{font-size:34px}
  .list.two{grid-template-columns:1fr 1fr}
  .sheet{border-radius:14px;margin:auto;max-height:86vh}
  .modal{align-items:center;padding:24px}
}

  main{max-width:1040px}
}

<script>
/* ===== Built-in bank · multiple choice (English) ===== */
const BUILTIN_MCQ = [
{id:'m01',type:'mcq',ch:'1.1',t:'Scarcity',q:'In economics, scarcity means that:',o:['resources are physically scarce in absolute terms','wants are unlimited while the resources to satisfy them are limited','prices are too high for consumers to afford the goods','supply happens to be short in a particular period'],a:1,e:'Scarcity is relative: unlimited wants against limited resources, which forces choices. High prices or a temporary shortage are symptoms, not the definition.'},
{id:'m02',type:'mcq',ch:'1.1',t:'Opportunity cost',q:'Opportunity cost is:',o:['the money actually paid for a good','the value of the next best alternative forgone','the sum of the values of all alternatives forgone','a cost already incurred that cannot be recovered'],a:1,e:'Only the single next best alternative counts. The sum of all alternatives and sunk costs are excluded.'},
{id:'m03',type:'mcq',ch:'1.1',t:'Basic questions',q:'Which of these is not one of the three basic questions of resource allocation?',o:['What to produce and how much','How to produce','For whom to produce','When to produce'],a:3,e:'The three questions are what, how and for whom. Timing is not one of them.'},
{id:'m04',type:'mcq',ch:'1.1',t:'Sunk cost',q:'A student gives up a part-time job paying 15 yuan per hour to attend a class. The tuition fee was paid earlier and is non-refundable. The opportunity cost of attending this class is:',o:['the 15 yuan of hourly pay forgone','the 15 yuan plus the tuition fee','the tuition fee only','zero, because the fee has already been paid'],a:0,e:'The tuition fee is a sunk cost and does not enter this decision. Only the pay forgone counts.'},
{id:'m05',type:'mcq',ch:'1.2',t:'Normative',q:'Which statement is normative?',o:['The unemployment rate was 5 per cent last year','The government should raise the minimum wage','Raising the minimum wage raises costs for firms','The CPI rose by 3 per cent year on year'],a:1,e:'Statements with should, ought or fair involve value judgements and cannot be tested directly with data.'},
{id:'m06',type:'mcq',ch:'1.2',t:'Ceteris paribus',q:'The purpose of ceteris paribus in economics is to:',o:['make models more realistic','isolate one variable so that its separate effect can be observed','prove that a conclusion is always correct','replace the need for data'],a:1,e:'Holding other variables constant is a modelling device. It does not guarantee that the conclusion holds in reality.'},
{id:'m07',type:'mcq',ch:'1.2',t:'Models',q:'Economists use simplified models rather than describing all of reality because:',o:['real-world data are always wrong','complex reality cannot be grasped directly, so simplification reveals key relationships','models may assume anything they like','governments require them'],a:1,e:'Abstraction highlights the key mechanism, at the cost of a limited scope of application.'},
{id:'m08',type:'mcq',ch:'1.3',t:'Factor rewards',q:'The reward for capital is:',o:['rent','wages','interest','profit'],a:2,e:'Land earns rent, labour earns wages, capital earns interest and enterprise earns profit.'},
{id:'m09',type:'mcq',ch:'1.3',t:'Human capital',q:'Government spending on education and training directly improves:',o:['the quantity of land','the quality of labour, that is human capital','the quantity of capital goods','risk-taking by entrepreneurs'],a:1,e:'Better skills raise productivity, which is a quality improvement in labour.'},
{id:'m10',type:'mcq',ch:'1.3',t:'Division of labour',q:'A major disadvantage of division of labour is that:',o:['it lowers output per worker','production becomes dependent on single stages and vulnerable to disruption','it raises training costs beyond reach','it reduces total output'],a:1,e:'Specialisation raises efficiency but makes the process fragile, monotonous and dependent on each stage.'},
{id:'m11',type:'mcq',ch:'1.4',t:'Price mechanism',q:'Which is not a function of the price mechanism?',o:['Signalling','Rationing','Incentive','Directly redistributing income'],a:3,e:'Prices signal, ration and incentivise. Redistribution requires taxes and transfers.'},
{id:'m12',type:'mcq',ch:'1.4',t:'Mixed economy',q:'A mixed economy is one in which:',o:['only the private sector allocates resources','only the public sector allocates resources','resources are allocated by both the private and the public sector','there are no prices'],a:2,e:'Market allocation coexists with government provision, regulation and redistribution.'},
{id:'m13',type:'mcq',ch:'1.5',t:'PPC',q:'Which change shifts a production possibility curve outwards?',o:['A fall in unemployment','More intensive use of existing resources','An increase in the quantity or quality of resources, or better technology','A change in consumer tastes'],a:2,e:'The curve shifts only when productive capacity itself expands. Reducing unemployment merely moves the economy from inside the curve onto it.'},
{id:'m14',type:'mcq',ch:'1.5',t:'PPC shape',q:'A PPC that is concave to the origin shows:',o:['constant opportunity cost','increasing opportunity cost','decreasing opportunity cost','unlimited resources'],a:1,e:'Resources are not perfectly transferable, so each extra unit costs more of the other good.'},
{id:'m15',type:'mcq',ch:'1.5',t:'PPC point',q:'A production combination inside the PPC indicates that:',o:['there has been technical progress','resources are unemployed or used inefficiently','opportunity cost is zero','maximum output has been reached'],a:1,e:'Inside the curve means idle or badly used resources; only points on the curve show full and efficient employment.'},
{id:'m16',type:'mcq',ch:'1.5',t:'Capital goods',q:'If an economy devotes more resources to capital goods rather than consumer goods:',o:['consumption rises now and capacity is unchanged','consumption falls now but the PPC shifts outwards later','consumption falls now and capacity falls later','both rise'],a:1,e:'Capital goods are not consumed today but add to future capacity, which is the basis of growth.'},
{id:'m17',type:'mcq',ch:'1.6',t:'Public good',q:'The two defining features of a public good are:',o:['rivalry and excludability','non-rivalry and non-excludability','low price and high quality','production by the government'],a:1,e:'One person consuming it does not reduce availability to others, and non-payers cannot be excluded.'},
{id:'m18',type:'mcq',ch:'1.6',t:'Free rider',q:'Public goods are under-provided in a free market mainly because:',o:['production costs are too high','consumers can free-ride, so firms cannot recover their costs','the government bans production','demand is too small'],a:1,e:'Non-excludability means non-payers can also consume, so willingness to pay collapses.'},
{id:'m19',type:'mcq',ch:'1.6',t:'Merit good',q:'A merit good is under-consumed in a free market mainly because:',o:['its price is too high','consumers underestimate its private benefits, an information failure','too much is produced','firms refuse to produce it'],a:1,e:'Underestimated benefits plus positive externalities mean the social optimum exceeds the market outcome.'},
{id:'m20',type:'mcq',ch:'2.1',t:'Effective demand',q:'Demand requires:',o:['willingness and ability to buy','willingness only','ability only','advertising'],a:0,e:'Effective demand combines willingness with the ability to pay.'},
{id:'m21',type:'mcq',ch:'2.1',t:'Demand shift',q:'Consumer income rises for a normal good. The demand curve will:',o:['move up along the curve','shift to the right','shift to the left','stay unchanged'],a:1,e:'Income is an external determinant, so the whole curve shifts. Only a change in the good own price moves along the curve.'},
{id:'m22',type:'mcq',ch:'2.1',t:'Joint supply',q:'Beef prices rise and more cattle are reared. The supply of leather, a by-product, will:',o:['fall','rise','stay unchanged','rise then fall'],a:1,e:'In joint supply one production process yields both goods, so more beef means more leather and a lower leather price.'},
{id:'m23',type:'mcq',ch:'2.2',t:'PED',q:'A good has PED of −2. If the firm raises price by 10 per cent, total revenue will:',o:['rise','fall','stay the same','cannot be determined'],a:1,e:'Demand is elastic, so quantity falls by about 20 per cent, more than the price rise, and revenue falls.'},
{id:'m24',type:'mcq',ch:'2.2',t:'PED',q:'A perfectly inelastic demand curve is:',o:['horizontal','vertical','at 45 degrees','upward sloping'],a:1,e:'Quantity does not respond at all, so the curve is vertical and PED equals zero.'},
{id:'m25',type:'mcq',ch:'2.2',t:'YED',q:'A good has YED of +2.5. If income falls by 10 per cent, quantity demanded will:',o:['rise by 25 per cent','fall by 25 per cent','fall by 2.5 per cent','not change'],a:1,e:'YED above one means a luxury good, so demand falls proportionally more than income.'},
{id:'m26',type:'mcq',ch:'2.2',t:'XED',q:'A negative XED between two goods means they are:',o:['substitutes','complements','unrelated','the same good'],a:1,e:'A rise in the price of B reduces demand for A, so the two are used together.'},
{id:'m27',type:'mcq',ch:'2.2',t:'Revenue effect',q:'A poor harvest reduces the supply of a farm product whose demand is inelastic. Farmers total revenue will usually:',o:['rise, because the price increase is larger than the fall in quantity','fall','stay unchanged','fall to zero'],a:0,e:'With inelastic demand, price rises sharply while quantity falls only slightly, so revenue rises. This explains the paradox of plenty.'},
{id:'m28',type:'mcq',ch:'2.3',t:'PES',q:'The most important determinant of price elasticity of supply is:',o:['the length of the time period','the colour of the good','consumer income','advertising'],a:0,e:'In the short run capacity is fixed, so PES is low; over time firms can expand and enter, so PES rises.'},
{id:'m29',type:'mcq',ch:'2.3',t:'PES',q:'A factory running at full capacity with very low stocks will have:',o:['high PES','low PES','PES equal to one','infinite PES'],a:1,e:'Without spare capacity or stock, a higher price cannot quickly raise output.'},
{id:'m30',type:'mcq',ch:'2.4',t:'Shortage',q:'When the market price is below the equilibrium price, there will be:',o:['a surplus, so price falls','a shortage, so price rises','equilibrium','no trade at all'],a:1,e:'Quantity demanded exceeds quantity supplied and buyers bid the price up.'},
{id:'m31',type:'mcq',ch:'2.4',t:'Equilibrium change',q:'If demand and supply both increase, then:',o:['quantity rises and price must rise','quantity rises but the price change is uncertain','both price and quantity rise','quantity must fall'],a:1,e:'Quantity must increase; price depends on which shift is larger.'},
{id:'m32',type:'mcq',ch:'2.5',t:'Consumer surplus',q:'Consumer surplus is shown by the area:',o:['below the demand curve and above the market price','above the supply curve and below the price','between the two curves','under the axes'],a:0,e:'It is the difference between willingness to pay and the price actually paid.'},
{id:'m33',type:'mcq',ch:'2.5',t:'Surplus',q:'If the price of a good rises, other things equal:',o:['consumer surplus rises and producer surplus falls','consumer surplus falls and producer surplus rises','both rise','both fall'],a:1,e:'Consumers pay more for less; producers receive more per unit and supply more.'},
{id:'m34',type:'mcq',ch:'3.1',t:'Market failure',q:'Market failure means that:',o:['no trade takes place in the market','prices are too high','resources are allocated inefficiently and welfare is not maximised','firms make losses'],a:2,e:'The price mechanism fails to allocate resources at the social optimum.'},
{id:'m35',type:'mcq',ch:'3.1',t:'Government failure',q:'Which is an example of government failure?',o:['A pollution tax reduces output','A subsidy causes overproduction and waste','Consumers change their tastes','Firms cut their prices'],a:1,e:'Intervention that worsens allocation, for example through distorted incentives or poor information, is government failure.'},
{id:'m36',type:'mcq',ch:'3.1',t:'Rationale',q:'The strongest economic reason for subsidising education is that:',o:['education has no cost','education creates positive externalities and families underestimate its benefits','education is a pure public good','teachers are poorly paid'],a:1,e:'External benefits and information failure mean the market under-consumes education. Education is not a pure public good.'},
{id:'m37',type:'mcq',ch:'3.2',t:'Tax types',q:'The difference between a specific tax and an ad valorem tax is that:',o:['the first is a fixed amount per unit, the second a percentage of price','the first is paid by consumers, the second by producers','the first applies only to imports','the first does not shift the supply curve'],a:0,e:'A specific tax shifts supply up by a constant amount; an ad valorem tax pivots the curve because the tax rises with price.'},
{id:'m38',type:'mcq',ch:'3.2',t:'Tax incidence',q:'Demand for a good is perfectly inelastic and supply is elastic. With a specific tax, the burden falls mainly on:',o:['consumers, because demand is inelastic and the tax can be passed on almost fully','producers, because supply is elastic','the government','both sides equally'],a:0,e:'The less elastic side bears more of the tax. With inelastic demand, price rises almost by the full tax and quantity barely changes.'},
{id:'m39',type:'mcq',ch:'3.2',t:'Maximum price',q:'A maximum price set below equilibrium is most likely to cause:',o:['a surplus','a shortage with non-price rationing and black markets','higher producer revenue','the market to clear'],a:1,e:'Price below equilibrium means quantity demanded exceeds supply, so queues, quotas and black markets appear.'},
{id:'m40',type:'mcq',ch:'3.2',t:'Subsidy',q:'If the government pays a subsidy per unit to producers, other things equal:',o:['supply shifts right, price falls, quantity rises and the government bears the cost','supply shifts left and price rises','demand shifts right','only producers gain'],a:0,e:'A subsidy cuts unit cost and shifts supply right; consumers gain from a lower price, while taxpayers bear the cost.'},
{id:'m41',type:'mcq',ch:'3.3',t:'Income vs wealth',q:'Which statement about income and wealth is correct?',o:['income is a flow, wealth is a stock','income is a stock, wealth is a flow','both mean annual cash inflow','wealth means cash only'],a:0,e:'Income arrives over a period; wealth is the assets owned at a point in time.'},
{id:'m42',type:'mcq',ch:'3.3',t:'Gini',q:'A Gini coefficient of zero means:',o:['income is perfectly equally distributed','income is perfectly unequally distributed','there is no income','everyone has negative income'],a:0,e:'Zero is perfect equality and one is perfect inequality.'},
{id:'m43',type:'mcq',ch:'3.3',t:'Regressive tax',q:'A uniform 10 per cent indirect tax on staple foods is, for low-income households:',o:['progressive','regressive, because food takes a larger share of their income','strictly proportional, so the burden is equal','unrelated to distribution'],a:1,e:'A flat rate on a necessity takes a larger share of low incomes, so the effective burden is regressive.'},
{id:'m44',type:'mcq',ch:'4.1',t:'GDP vs GNI',q:'The difference between GDP and GNI is that:',o:['GDP uses current prices and GNI constant prices','GNI adds net factor income from abroad to GDP','GDP covers manufacturing only','they are identical'],a:1,e:'GDP is a domestic concept; GNI adds income earned abroad by residents and subtracts income paid to foreigners.'},
{id:'m45',type:'mcq',ch:'4.1',t:'Real GDP',q:'Nominal GDP rises by 6 per cent while the GDP deflator rises by 5 per cent. Real GDP rises by about:',o:['11 per cent','1 per cent','minus 1 per cent','5 per cent'],a:1,e:'Real growth is roughly nominal growth minus inflation, so about 1 per cent.'},
{id:'m46',type:'mcq',ch:'4.1',t:'GDP limits',q:'The main weakness of GDP as a measure of living standards is that:',o:['it ignores non-market output, the hidden economy and environmental damage, and says nothing about distribution','it counts agriculture only','it excludes services','it is measured in foreign currency'],a:0,e:'GDP misses unpaid work and negative externalities and does not show how income is shared.'},
{id:'m47',type:'mcq',ch:'4.2',t:'Injections',q:'Which set contains only injections?',o:['Investment, government spending and exports','Saving, taxation and imports','Consumption, investment and saving','Wages, profit and rent'],a:0,e:'Injections are I, G and X; leakages are S, T and M.'},
{id:'m48',type:'mcq',ch:'4.2',t:'Leakages',q:'If saving, taxation and imports together exceed investment, government spending and exports, national income will:',o:['rise','fall','stay the same','rise then fall'],a:1,e:'Leakages larger than injections shrink the circular flow until the two are equal.'},
{id:'m49',type:'mcq',ch:'4.2',t:'Transfers',q:'Unemployment benefit paid by the government is:',o:['counted in GDP as government spending','a transfer payment, so it is excluded from GDP','counted as exports','counted as investment'],a:1,e:'No output is produced when the payment is made, so it is redistribution rather than government consumption.'},
{id:'m50',type:'mcq',ch:'4.3',t:'AD',q:'Aggregate demand is:',o:['C + I + G + (X − M)','C + I + G + T','wages + profit + rent + interest','consumption + saving'],a:0,e:'AD is planned spending at a given price level, including net exports.'},
{id:'m51',type:'mcq',ch:'4.3',t:'SRAS',q:'Money wages rise sharply while productivity is unchanged. The likely result is:',o:['SRAS shifts left, prices rise and output falls','SRAS shifts right and prices fall','AD shifts right and output rises','LRAS shifts right immediately'],a:0,e:'Higher wage costs shift SRAS left, producing stagflation: lower output with higher prices.'},
{id:'m52',type:'mcq',ch:'4.3',t:'LRAS',q:'In the neo-classical model the long-run aggregate supply curve is:',o:['vertical at the full-employment level of output','horizontal','upward sloping','downward sloping'],a:0,e:'With fully flexible wages and prices, output returns to full capacity whatever the price level.'},
{id:'m53',type:'mcq',ch:'4.4',t:'Potential growth',q:'Potential economic growth is shown by:',o:['a rightward shift of LRAS','a rightward shift of AD','movements along SRAS','a rise in the CPI'],a:0,e:'Capacity grows when factors of production improve or technology advances, independently of demand.'},
{id:'m54',type:'mcq',ch:'4.4',t:'Recession',q:'A recession is usually defined as:',o:['two consecutive quarters of negative real GDP growth','inflation above 5 per cent','unemployment above 10 per cent','a 20 per cent fall in share prices'],a:0,e:'The standard definition refers to two successive quarters of falling real output.'},
{id:'m55',type:'mcq',ch:'4.4',t:'Sustainability',q:'Sustainable growth means growth that:',o:['is as fast as possible','does not damage the resources and environment of future generations','is driven only by exports','keeps prices constant'],a:1,e:'Sustainability refers to intergenerational fairness in resource use and environmental damage.'},
{id:'m56',type:'mcq',ch:'4.5',t:'Structural',q:'A worker loses a job when a coal mine closes and only unrelated service jobs exist nearby. This is:',o:['frictional unemployment','structural unemployment','cyclical unemployment','seasonal unemployment'],a:1,e:'A mismatch of skills or location caused by structural change is structural unemployment.'},
{id:'m57',type:'mcq',ch:'4.5',t:'Full employment',q:'Full employment means:',o:['zero unemployment','only frictional and seasonal unemployment remain','everyone does the same job','only structural unemployment remains'],a:1,e:'Some unemployment always exists, so full employment means the natural rate remains.'},
{id:'m58',type:'mcq',ch:'4.5',t:'Policy fit',q:'Expansionary demand policy applied to structural unemployment will usually:',o:['eliminate it quickly','have limited effect and may raise inflation','necessarily reduce inflation','automatically improve matching'],a:1,e:'Extra demand does not give workers new skills, so it mainly raises prices.'},
{id:'m59',type:'mcq',ch:'4.6',t:'CPI',q:'The consumer prices index is:',o:['a weighted index of a basket of consumer prices compared with a base year','a simple average of all prices','the GDP deflator','the growth rate of wages'],a:0,e:'The CPI weights a representative basket by household spending patterns and compares it with a base period.'},
{id:'m60',type:'mcq',ch:'4.6',t:'Cost-push',q:'Inflation caused by sharp rises in energy and raw material prices is:',o:['demand-pull','cost-push','monetary','structural deflation'],a:1,e:'Higher input costs shift SRAS left, so prices rise while output falls.'},
{id:'m61',type:'mcq',ch:'4.6',t:'Redistribution',q:'A borrower with a fixed-rate loan during rising inflation usually:',o:['gains, because the real value of repayments falls','loses, because repayments rise','is unaffected','immediately demands higher rates'],a:0,e:'Inflation erodes the real value of fixed nominal debt, so debtors gain and creditors lose.'},
{id:'m62',type:'mcq',ch:'5.1',t:'Objectives',q:'Which is not a macroeconomic objective?',o:['Economic growth','Full employment','Price stability','Maximising the profit of a single firm'],a:3,e:'Macro objectives are growth, employment, price stability, a balanced external position and improved distribution.'},
{id:'m63',type:'mcq',ch:'5.1',t:'Conflicts',q:'Rapid economic growth is most likely to conflict with:',o:['price stability','a balanced current account','full employment','none of these ever conflict'],a:1,e:'Faster growth raises incomes and imports, tending to widen the current account deficit; it can also feed inflation.'},
{id:'m64',type:'mcq',ch:'5.2',t:'Stabilisers',q:'Which is an automatic stabiliser?',o:['Progressive income tax and unemployment benefit','Building a new high-speed railway','A cut in interest rates','A change in tariffs'],a:0,e:'Tax revenue rises in a boom and benefit spending rises in a slump without any new decision.'},
{id:'m65',type:'mcq',ch:'5.2',t:'Crowding out',q:'Crowding out occurs when:',o:['government borrowing raises interest rates and reduces private investment','government spending replaces private consumption','tax cuts reduce consumption','exports replace imports'],a:0,e:'Financing a deficit can push up rates and squeeze private capital spending.'},
{id:'m66',type:'mcq',ch:'5.3',t:'Transmission',q:'When the central bank raises interest rates, the first effect is:',o:['commercial lending rates rise, so consumption and investment fall','government tax revenue rises automatically','the exchange rate is fixed immediately','exports rise immediately'],a:0,e:'Higher rates raise borrowing costs, reducing spending and therefore aggregate demand.'},
{id:'m67',type:'mcq',ch:'5.3',t:'QE',q:'The main aim of quantitative easing is to:',o:['buy assets to lower long-term interest rates and increase liquidity','raise tax rates','increase government spending directly','restrict bank lending'],a:0,e:'When policy rates are near zero, asset purchases inject money and push down longer-term yields.'},
{id:'m68',type:'mcq',ch:'5.4',t:'Market-based',q:'Which is a market-based supply-side policy?',o:['Deregulation, tax cuts and privatisation','Building more state schools','Raising the minimum wage','Increasing unemployment benefit'],a:0,e:'Market-based measures sharpen competition and incentives; interventionist ones involve direct government provision.'},
{id:'m69',type:'mcq',ch:'5.4',t:'Limits',q:'The main limitation of supply-side policy is that:',o:['its effects take a long time to appear and it may widen inequality','it always causes inflation','only central banks can use it','it has no effect on output'],a:0,e:'Education and infrastructure take years to pay off, and tax cuts may benefit the rich most.'},
{id:'m70',type:'mcq',ch:'6.1',t:'Comparative advantage',q:'A country has a comparative advantage in a good when:',o:['its opportunity cost of producing the good is lower than its partner','it uses fewer resources to produce the good','its output is the largest','its price is the lowest'],a:0,e:'Comparative advantage compares opportunity costs, not absolute efficiency.'},
{id:'m71',type:'mcq',ch:'6.1',t:'Absolute advantage',q:'Absolute advantage means:',o:['producing the same output with fewer resources than a partner','having a lower opportunity cost','having larger total exports','having lower tariffs'],a:0,e:'Absolute advantage is about resource input per unit; comparative advantage is about what must be given up.'},
{id:'m72',type:'mcq',ch:'6.2',t:'Quota vs tariff',q:'Compared with an equivalent tariff, an import quota:',o:['gives no tariff revenue to the government, and the scarcity rent goes to licence holders','does not raise domestic prices','necessarily increases imports','needs no licence'],a:0,e:'Both restrict imports and raise domestic prices; a quota transfers the rent to licence holders and invites rent-seeking.'},
{id:'m73',type:'mcq',ch:'6.2',t:'Protection',q:'A tariff on imports has which direct effect on domestic consumers?',o:['Less choice and higher prices','Lower prices','More choice','No effect'],a:0,e:'Tariffs raise the domestic price of imports and reduce the quantity imported.'},
{id:'m74',type:'mcq',ch:'6.3',t:'Current account',q:'The current account records:',o:['trade in goods and services, primary income and current transfers','goods only','direct investment only','all financial asset transactions'],a:0,e:'Financial flows belong to the financial account, not the current account.'},
{id:'m75',type:'mcq',ch:'6.3',t:'Deficit',q:'Whether a current account deficit is sustainable depends mainly on:',o:['whether the deficit finances productive investment and whether financing can continue','the absolute size of the deficit','whether exports are the largest in the world','whether the exchange rate is fixed'],a:0,e:'A deficit that funds capital imports and is financed by stable long-term inflows can be sustained.'},
{id:'m76',type:'mcq',ch:'6.4',t:'Depreciation',q:'Other things equal, a depreciation of the currency means:',o:['export prices in foreign currency fall and import prices in domestic currency rise','both export and import prices fall','imports become cheaper','exports rise immediately'],a:0,e:'Domestic goods become cheaper abroad and foreign goods dearer at home, which should stimulate exports and dampen imports.'},
{id:'m77',type:'mcq',ch:'6.4',t:'Exchange rate',q:'If a central bank raises interest rates while partners do not, the currency usually:',o:['appreciates, as capital inflows increase','depreciates, as capital flows out','stays unchanged','depreciates then appreciates'],a:0,e:'Higher returns attract capital, raising demand for the currency.'},
{id:'m78',type:'mcq',ch:'6.5',t:'Expenditure switching',q:'Expenditure-switching policies:',o:['switch domestic spending towards home-produced goods through devaluation or tariffs','cut government spending and consumption','raise taxes','raise interest rates'],a:0,e:'Switching changes the composition of spending; expenditure-reducing policies change its level.'},
{id:'m79',type:'mcq',ch:'6.5',t:'J-curve',q:'The J-curve effect shows that, after a depreciation, the trade balance:',o:['usually worsens before it improves','improves immediately','is unaffected','improves permanently at once'],a:0,e:'Contracts are fixed in the short run, so import prices rise before volumes adjust.'},
{id:'m80',type:'mcq',ch:'T',t:'8-mark marking',q:'In an 8-mark question, the usual caps are:',o:['AO1 3, AO2 3, AO3 2','AO1 4, AO2 4','AO1 2, AO2 4, AO3 2','there are no caps'],a:0,e:'Eight marks split into knowledge, application and evaluation; a list of definitions cannot reach the top.'},
{id:'m81',type:'mcq',ch:'T',t:'12-mark band',q:'To reach the top band in the 8-mark part of a 12-mark essay you need:',o:['accurate concepts, both sides developed and clear causal chains','as many examples as possible','definitions only','complex sentences'],a:0,e:'Examples support analysis but cannot replace it; balance and mechanism earn the marks.'},
{id:'m82',type:'mcq',ch:'T',t:'Evaluation',q:'The most effective way to end an 8-mark answer with evaluation is:',o:['“This depends on …” followed by a condition','“In conclusion, it is very important”','repeating the question','listing every point'],a:0,e:'A conditional judgement using a variable from the question earns AO3; vague summaries do not.'},
{id:'m83',type:'mcq',ch:'T',t:'Conclusion',q:'The safest conclusion for a 12-mark essay is:',o:['a conditional judgement, depending on elasticity, time or scale, with a clear direction','saying that both sides have advantages','repeating the body','writing one definition'],a:0,e:'The conclusion must answer the question under stated conditions and commit to a direction.'}
];
