/* ===== Built-in bank · Paper 1 multiple choice, June 2026 v11–14 ===== */
const BUILTIN_P1 = [
{id:'9708_s26_qp_11_Q1',type:'mcq',ch:'1.6',q:"What is an example of a want rather than a need?",o:["clothing", "food", "holiday", "water"],a:2,e:"A holiday is a want; clothing, food and water are needs.",src:'9708_s26_qp_11_Q1'},
{id:'9708_s26_qp_11_Q2',type:'mcq',ch:'1.6',q:"Which combination would occur for a demerit good?",o:["over-consumed, negative impact", "under-consumed, negative impact", "over-consumed, positive impact", "under-consumed, positive impact"],a:0,e:"Demerit goods are over-consumed and carry negative externalities, which is why governments try to restrict them.",src:'9708_s26_qp_11_Q2'},
{id:'9708_s26_qp_11_Q3',type:'mcq',ch:'1.1',q:"A school leaver decides to study for a degree in accountancy at university rather than take a job as a trainee accountant.\nWhat will increase the opportunity cost of this decision?",o:["A rise in students failing to complete accountancy degree courses.", "A rise in the hours worked by trainee accountants.", "A rise in the university tuition fees for accountancy degree courses.", "A rise in the wage rate for trainee accountants."],a:3,e:"The opportunity cost is the pay forgone; a higher trainee wage rate raises what the student gives up.",src:'9708_s26_qp_11_Q3'},
{id:'9708_s26_qp_11_Q4',type:'mcq',ch:'1.2',q:"Which statement is normative?",o:["A minimum wage is the correct government policy to increase the incomes of the lowest paid workers.", "A minimum wage is the lowest amount that employers can legally pay their workers.", "In Pakistan, a minimum wage of 15000 Pakistani rupees per month was set on 1 June 2016.", "Setting the minimum wage rate above the equilibrium will result in an excess supply of workers."],a:0,e:"'Correct policy' is a value judgement: the statement cannot be tested as true or false. The rest are factual statements.",src:'9708_s26_qp_11_Q4'},
{id:'9708_s26_qp_11_Q5',type:'mcq',ch:'1.5',q:"What will always increase when the production possibility curve (PPC) shifts outwards?",o:["employment", "exports", "output", "productive capacity"],a:3,e:"An outward shift of the PPC raises productive capacity; actual output only follows if the extra capacity is used.",src:'9708_s26_qp_11_Q5'},
{id:'9708_s26_qp_11_Q6',type:'mcq',ch:'2.1',q:"What describes a market supply curve?",o:["It is downward sloping.", "It is the same as the aggregate supply curve.", "It is the sum of all firms’ supply curves for a product.", "It is the supply of all products within an economy."],a:2,e:"A market supply curve is the horizontal sum of the supply curves of every firm selling that product.",src:'9708_s26_qp_11_Q6'},
{id:'9708_s26_qp_11_Q7',type:'mcq',ch:'2.4',q:"The diagram shows the demand and supply curves of a normal good (X). Q1P1 is the\ninitial equilibrium.\nOther things being equal, what may cause the change in the market equilibrium to Q2P2?",o:["a fall in household incomes and an increase in interest rates", "a rise in workers’ real wages in all sectors of the economy", "an increase in income tax and a rise in the specific tax levied on X", "an increase in the price of a substitute product for X and a fall in the costs of producing X"],a:1,e:"Higher real wages raise household incomes, so demand shifts right and both price and quantity rise.",src:'9708_s26_qp_11_Q7'},
{id:'9708_s26_qp_11_Q8',type:'mcq',ch:'2.2',q:"Which statement defines the income elasticity of demand?",o:["It measures the responsiveness of income to a change in quantity demanded.", "It measures the responsiveness of income to a change in price.", "It measures the responsiveness of quantity demanded to a change in income.", "It measures the responsiveness of quantity demanded to a change in price."],a:2,e:"Income elasticity of demand measures how quantity demanded responds to a change in income.",src:'9708_s26_qp_11_Q8'},
{id:'9708_s26_qp_11_Q9',type:'mcq',ch:'2.3',q:"What is not a factor affecting price elasticity of supply?",o:["level of spare capacity", "price of complementary products", "resources available", "time period over which elasticity is measured"],a:1,e:"The price of a complementary product shifts demand, not supply; the other three are genuine supply influences.",src:'9708_s26_qp_11_Q9'},
{id:'9708_s26_qp_11_Q10',type:'mcq',ch:'2.5',q:"The diagram shows the market for a good that has an initial equilibrium price P. The demand for the good increases by a fixed quantity at every price.\nWhich supply curve will leave the value of the consumer surplus unchanged?",o:["S1", "S2", "S3", "S4"],a:0,e:"Consumer surplus is unchanged only when supply is perfectly inelastic (S1), so the quantity traded stays the same.",src:'9708_s26_qp_11_Q10'},
{id:'9708_s26_qp_11_Q11',type:'mcq',ch:'3.2',q:"Doctors are concerned about the negative health effects of sugary drinks.\nWhen would a tax on sugary drinks be least effective in improving health?",o:["when the demand for sugary drinks is income elastic", "when the demand for sugary drinks is income inelastic", "when the demand for sugary drinks is price elastic", "when the demand for sugary drinks is price inelastic"],a:3,e:"With price-inelastic demand a tax raises the price but consumption falls only a little, so health improves least.",src:'9708_s26_qp_11_Q11'},
{id:'9708_s26_qp_11_Q12',type:'mcq',ch:'4.1',q:"Which item would be included in the calculation of a person’s wealth?",o:["the dividend on shares owned by the person", "the interest on the person’s savings account", "the value of the house owned by the person", "the wages paid for the person’s work"],a:2,e:"Wealth is a stock of owned assets: the value of the house. The others are flows of income.",src:'9708_s26_qp_11_Q12'},
{id:'9708_s26_qp_11_Q13',type:'mcq',ch:'3.2',q:"The diagram shows the market for bus services before and after a government subsidy.\nWhich area on the diagram shows the incidence of the subsidy for the consumer?",o:["P1HIP2", "P1JKP2", "P2IGP3", "P2KLP3"],a:1,e:"Consumer incidence is the fall in price the consumer pays, P1 to P2, applied to the quantity bought: P1JKP2.",src:'9708_s26_qp_11_Q13'},
{id:'9708_s26_qp_11_Q14',type:'mcq',ch:'3.1',q:"What is not a reason for government intervention in a market economy?",o:["discouraging the consumption of demerit goods", "overcoming information failure", "raising the provision of merit goods", "reducing competition in the economy"],a:3,e:"Governments intervene to correct market failure; reducing competition would create it, not correct it.",src:'9708_s26_qp_11_Q14'},
{id:'9708_s26_qp_11_Q15',type:'mcq',ch:'3.2',q:"The market for good X is in equilibrium with 1000 units sold at a price of $10. The government puts a specific tax of $1 per unit on the producers of good X.\nWhich value for the price elasticity of demand for good X will generate the largest tax revenue?",o:["0", "0.5", "1.0", "1.5"],a:0,e:"Revenue is tax times quantity; quantity falls least when demand is perfectly inelastic, PED = 0.",src:'9708_s26_qp_11_Q15'},
{id:'9708_s26_qp_11_Q16',type:'mcq',ch:'4.1',q:"Which adjustments are needed to change Gross Domestic Product (GDP) at basic prices to GDP at market prices?",o:["add subsidies, add indirect taxes", "subtract subsidies, add indirect taxes", "add subsidies, subtract indirect taxes", "subtract subsidies, subtract indirect taxes"],a:1,e:"Basic to market prices means subtracting subsidies and adding indirect taxes.",src:'9708_s26_qp_11_Q16'},
{id:'9708_s26_qp_11_Q17',type:'mcq',ch:'4.1',q:"Nominal GDP of a country at current market prices was $1000bn in year 1. In year 2, its nominal GDP had risen to $1050bn.\nWhat happened to real GDP if the general price level had increased by 10% over the same period?",o:["Real GDP decreased by approximately 5%.", "Real GDP decreased by approximately 10%.", "Real GDP increased by approximately 5%.", "Real GDP increased by approximately 10%."],a:0,e:"Nominal GDP rose 5% while prices rose 10%, so real GDP fell by roughly 5%.",src:'9708_s26_qp_11_Q17'},
{id:'9708_s26_qp_11_Q18',type:'mcq',ch:'4.2',q:"What would be an injection into the circular flow of income?",o:["an increase in imports", "an increase in investment", "an increase in savings", "an increase in taxation"],a:1,e:"Investment is an injection; imports, savings and taxation are leakages.",src:'9708_s26_qp_11_Q18'},
{id:'9708_s26_qp_11_Q19',type:'mcq',ch:'4.3',q:"In which situation would an increase in consumption not cause an increase in real GDP?",o:["the current rate of GDP growth is less than the country’s target rate", "the economy is experiencing low rates of inflation", "the economy is in recession", "the economy is operating at full capacity"],a:3,e:"At full capacity extra consumption bids up prices instead of output, so real GDP does not rise.",src:'9708_s26_qp_11_Q19'},
{id:'9708_s26_qp_11_Q20',type:'mcq',ch:'4.6',q:"The UK inflation rate as measured by the Consumer Price Index (CPI) was 5.2% in September 2011. In June 2014, the rate measured by the CPI was 1.6%.\nWhat can be concluded about the period September 2011 to June 2014?",o:["Fixed income earners had increased purchasing power.", "Prices were falling.", "The rate of price increases was slowing.", "The real rate of interest became positive."],a:2,e:"Inflation fell from 5.2% to 1.6%, so prices were still rising, just more slowly.",src:'9708_s26_qp_11_Q20'},
{id:'9708_s26_qp_11_Q21',type:'mcq',ch:'5.2',q:"The table shows government revenue and expenditure of four countries as a percentage of GDP\nin 2000 and 2010.\nWhich country moved from a budget deficit position in 2000 to a budget surplus in 2010?",o:["France", "Norway", "Sweden", "Switzerland"],a:3,e:"Switzerland had expenditure above revenue in 2000 and revenue above expenditure in 2010.",src:'9708_s26_qp_11_Q21'},
{id:'9708_s26_qp_11_Q22',type:'mcq',ch:'5.3',q:"Some countries experienced a recent decline in investment spending.\nWhat might be done to stop such a decline?",o:["increase quotas on imports", "lower interest rates", "raise income tax", "set up training courses"],a:1,e:"Lower interest rates make borrowing cheaper and raise investment spending.",src:'9708_s26_qp_11_Q22'},
{id:'9708_s26_qp_11_Q23',type:'mcq',ch:'4.6',q:"What is a reason for a government policy that aims at achieving a low and stable rate of inflation?",o:["Consumers are encouraged to increase spending on imports.", "Firms are encouraged to increase the level of production.", "The central bank is encouraged to increase the interest rate.", "The government is encouraged to increase the rate of income tax."],a:1,e:"Low, stable inflation reduces uncertainty so firms invest and produce more.",src:'9708_s26_qp_11_Q23'},
{id:'9708_s26_qp_11_Q24',type:'mcq',ch:'5.4',q:"What is an objective of supply-side policy?",o:["to shift the short-run aggregate supply (SRAS) curve to the left", "to shift the short-run aggregate supply (SRAS) curve to the right", "to shift the long-run aggregate supply (LRAS) curve to the left", "to shift the long-run aggregate supply (LRAS) curve to the right"],a:3,e:"Supply-side policy aims to shift the long-run aggregate supply curve to the right.",src:'9708_s26_qp_11_Q24'},
{id:'9708_s26_qp_11_Q25',type:'mcq',ch:'5.2',q:"What is most likely to improve the effectiveness of an expansionary fiscal policy in an economy?",o:["a fall in consumer confidence", "a fall in the size of the labour force", "an increase in interest rates", "an increase in the money supply"],a:3,e:"A growing money supply keeps borrowing cheap, so the extra spending is not crowded out by higher interest rates.",src:'9708_s26_qp_11_Q25'},
{id:'9708_s26_qp_11_Q26',type:'mcq',ch:'6.2',q:"Which measure would not be part of a government subsidy to protect domestic producers\nfrom competition?",o:["import quotas", "interest-free loans provided by the government", "reductions in profits (business) taxes", "financial help given to local firms"],a:0,e:"Import quotas restrict trade but they are a barrier, not a subsidy paid to producers.",src:'9708_s26_qp_11_Q26'},
{id:'9708_s26_qp_11_Q27',type:'mcq',ch:'6.1',q:"The table shows different possible outputs of apples and bananas for country X and country Y, assuming only two goods are produced and all resources are used to their maximum.\nCountry Y decides to specialise in the production of the good in which it has a comparative advantage. Country X decides to use 75% of its resources to produce the good in which it has a comparative advantage and 25% to produce the other good.\nWhat will be the total output?",o:["80 bananas and 50 apples", "45 bananas and 75 apples", "60 bananas and 75 apples", "120 bananas and 150 apples"],a:2,e:"Y specialises in apples (50). X gives 75% to bananas (60) and 25% to apples (25): total 75 apples, 60 bananas.",src:'9708_s26_qp_11_Q27'},
{id:'9708_s26_qp_11_Q28',type:'mcq',ch:'6.4',q:"Why may a government introduce a floating exchange rate?",o:["it allows government more independence in policy making", "it eliminates the instability of free markets", "it gives firms more confidence in future costs and prices", "it increases foreign exchange reserves"],a:0,e:"A floating rate lets the central bank set interest rates for domestic objectives rather than defending a parity.",src:'9708_s26_qp_11_Q28'},
{id:'9708_s26_qp_11_Q29',type:'mcq',ch:'6.3',q:"The table shows an extract from a country’s balance of payments.\nWhat is the current account balance?",o:["deficit of $10bn", "deficit of $50bn", "surplus of $25bn", "surplus of $30bn"],a:2,e:"Goods −50, services +40, primary income +40, secondary income −5, giving a surplus of $25bn.",src:'9708_s26_qp_11_Q29'},
{id:'9708_s26_qp_11_Q30',type:'mcq',ch:'5.4',q:"The diagram shows the aggregate demand (AD) curve and two long-run aggregate supply (LRAS) curves for an economy.\nThe government has reduced spending on welfare payments and increased spending on training for employment, so causing the shift from LRAS1 to LRAS2.\nWhat is most likely to happen as a result of this policy?",o:["An improvement in the current account of the balance of payments.", "An increase in inflation.", "An increase in the budget deficit.", "An increase in unemployment."],a:0,e:"Lower welfare and more training shift LRAS right, lowering unit costs and improving competitiveness, so the current account improves.",src:'9708_s26_qp_11_Q30'},
{id:'9708_s26_qp_12_Q1',type:'mcq',ch:'1.6',q:"Polio vaccination is provided free of charge in some countries.\nHow can this service be classified?",o:["a demerit good", "a free good", "a merit good", "a public good"],a:2,e:"Vaccination is a merit good: it is under-consumed by the market because the private benefit is not fully recognised.",src:'9708_s26_qp_12_Q1'},
{id:'9708_s26_qp_12_Q2',type:'mcq',ch:'1.5',q:"The diagram shows the production possibility curve (PPC) for an economy that can produce goods and services.\nIf the economy is producing at the boundary of its PPC, which statement is not correct?",o:["The economy is always producing both goods and services.", "The economy is using all of the available resources.", "The opportunity cost of producing goods is constant.", "There is no unemployment in the economy."],a:0,e:"At the boundary all resources are used, but an economy on the axes produces only one good, so 'always both' is wrong.",src:'9708_s26_qp_12_Q2'},
{id:'9708_s26_qp_12_Q3',type:'mcq',ch:'1.5',q:"In the diagram, JK is an economy’s original production possibility curve (PPC).\nWhat can cause the PPC to shift from JK to JL?",o:["a fall in output per worker of manufactured goods", "a fall in the demand for manufactured goods", "a rise in the quality of technology used in manufactured goods", "a rise in unemployment in the manufacturing sector"],a:0,e:"The x-intercept moves inward, which happens when less manufactured output can be produced from the same resources.",src:'9708_s26_qp_12_Q3'},
{id:'9708_s26_qp_12_Q4',type:'mcq',ch:'1.6',q:"What is the most likely problem when a government provides public goods?",o:["consumption of the good is rivalrous", "not all consumers are able to consume the good", "scarce resources may not be used in the most desirable way", "there may be underconsumption of the good"],a:2,e:"Public goods cannot be priced, so governments cannot know how much to provide and may misallocate scarce resources.",src:'9708_s26_qp_12_Q4'},
{id:'9708_s26_qp_12_Q5',type:'mcq',ch:'1.2',q:"Which statement about economics is not correct?",o:["Economic actions can produce unexpected side effects.", "Economic thinking is usually based on logical reasoning at the margin.", "The use of scarce resources to produce a good always has a cost.", "The value of a good or service involves a purely objective judgement."],a:3,e:"Values are subjective: what a good is worth depends on the person, not on an objective test.",src:'9708_s26_qp_12_Q5'},
{id:'9708_s26_qp_12_Q6',type:'mcq',ch:'2.3',q:"If the price elasticity of supply for a good is three and the price of the good increases by 10%, what\nis the increase in quantity supplied?",o:["3%", "7%", "30%", "33.3%"],a:2,e:"3 × 10% = 30%.",src:'9708_s26_qp_12_Q6'},
{id:'9708_s26_qp_12_Q7',type:'mcq',ch:'2.1',q:"The diagram shows an outward shift in the supply curve of televisions from S1 to S2.\nWhat may cause this shift?",o:["an increase in consumer incomes", "an increase in the cost of raw materials", "an increase in the price of complements", "an increase in the size of the working population"],a:3,e:"A larger working population increases the labour available, shifting supply to the right.",src:'9708_s26_qp_12_Q7'},
{id:'9708_s26_qp_12_Q8',type:'mcq',ch:'2.4',q:"The demand for housing continues to rise as real incomes increase and more construction firms enter the market to build more houses.\nWhich diagram represents this situation?",o:["Diagram A", "Diagram B", "Diagram C", "Diagram D"],a:0,e:"Rising incomes shift demand right while new firms shift supply right, so price stays similar and quantity rises.",src:'9708_s26_qp_12_Q8'},
{id:'9708_s26_qp_12_Q9',type:'mcq',ch:'2.5',q:"The demand curve for a product is perfectly elastic and the supply curve is unit elastic.\nWhat is the value of the consumer surplus and producer surplus?",o:["between zero and infinity zero", "infinity zero", "zero between zero and infinity", "zero infinity"],a:2,e:"With perfectly elastic demand consumers pay exactly what they are willing to pay, so consumer surplus is zero; producer surplus varies.",src:'9708_s26_qp_12_Q9'},
{id:'9708_s26_qp_12_Q10',type:'mcq',ch:'2.2',q:"The price of a pizza has increased from $8 to $10. This leads to a decrease in quantity demanded\nof 12.5%.\nWhat is the price elasticity of demand of pizza?",o:["0.5", "0.8", "1.6", "2.0"],a:0,e:"Price rises 25% while quantity falls 12.5%, so PED = 12.5/25 = 0.5.",src:'9708_s26_qp_12_Q10'},
{id:'9708_s26_qp_12_Q11',type:'mcq',ch:'3.2',q:"What would be categorised as direct government provision of goods and services?",o:["a government grant to a firm to provide healthcare services", "a government regulation on the amount of sugar in soft drinks", "a government subsidy to a firm that operates a regional train service", "a government takeover of a local bus service"],a:3,e:"Direct provision means the state supplies the good itself, as with a nationalised bus service.",src:'9708_s26_qp_12_Q11'},
{id:'9708_s26_qp_12_Q12',type:'mcq',ch:'3.2',q:"What is a transfer payment?",o:["advertising expenses incurred by a charity organisation", "food vouchers to help low-income households pay for food", "interest-free study loans given to deserving students by the government", "salary paid to a nurse working in a hospital that provides free treatment"],a:1,e:"Transfer payments are unrequited: vouchers move purchasing power without any good being produced in return.",src:'9708_s26_qp_12_Q12'},
{id:'9708_s26_qp_12_Q13',type:'mcq',ch:'3.2',q:"The diagram shows the impact of a government subsidy on the provision of a merit good. S is the\noriginal supply curve and S1 is the supply curve with the subsidy.\nWhat is the total cost of the subsidy?",o:["$200", "$400", "$800", "$1200"],a:2,e:"The subsidy lowers the price by $20 and 40 units are bought, so the cost is $800.",src:'9708_s26_qp_12_Q13'},
{id:'9708_s26_qp_12_Q14',type:'mcq',ch:'3.3',q:"Which combination of measures is likely to reduce inequality in income and wealth the most?",o:["less progressive lower threshold increase", "less progressive raise threshold decrease", "more progressive lower threshold increase", "more progressive raise threshold decrease"],a:2,e:"A more progressive income tax, a lower inheritance tax threshold and a higher minimum wage all compress the distribution.",src:'9708_s26_qp_12_Q14'},
{id:'9708_s26_qp_12_Q15',type:'mcq',ch:'3.2',q:"Health services in an economy are provided by private clinics that charge high fees. The government\ndecides health services should be provided for everyone, not based on ability to pay.\nWhich direct action should it take?",o:["build government clinics, that charge low fees, to compete in the market", "close private clinics where provision by the market is inadequate", "increase the taxes on profits made by private clinics", "nationalise private clinics and remove charging"],a:3,e:"To provide for everyone regardless of income, the state must take over provision and stop charging.",src:'9708_s26_qp_12_Q15'},
{id:'9708_s26_qp_12_Q16',type:'mcq',ch:'4.1',q:"Why might Gross Domestic Product (GDP) not be a useful measure of economic output?",o:["Application of technology has enabled a smaller size of workforce to achieve greater productivity.", "Damage to the environment is often unquantified or even ignored.", "Land reclamation has created more urban space to overcome crowding.", "Shortages in labour supplies have been overcome by international migration of labour."],a:1,e:"Environmental damage from output is not counted, so GDP overstates the value of output.",src:'9708_s26_qp_12_Q16'},
{id:'9708_s26_qp_12_Q17',type:'mcq',ch:'4.1',q:"What adjustment is made to change the value of Gross Domestic Product (GDP) from market prices\nto basic prices?",o:["add indirect taxes and add subsidies", "add indirect taxes and deduct subsidies", "deduct indirect taxes and add subsidies", "deduct indirect taxes and deduct subsidies"],a:2,e:"Market prices include indirect tax and the effect of subsidies, so deduct indirect taxes and add subsidies.",src:'9708_s26_qp_12_Q17'},
{id:'9708_s26_qp_12_Q18',type:'mcq',ch:'4.2',q:"What are injections into the circular flow of income?",o:["government spending, investment and exports", "government spending, savings and imports", "investment, savings and exports", "investment, taxes and imports"],a:0,e:"Government spending, investment and exports all add to the circular flow.",src:'9708_s26_qp_12_Q18'},
{id:'9708_s26_qp_12_Q19',type:'mcq',ch:'4.4',q:"What will decrease if the level of employment falls?",o:["labour force", "actual output", "productive capacity", "potential output"],a:1,e:"Employment falls, so fewer goods and services are produced: actual output drops while capacity is unchanged.",src:'9708_s26_qp_12_Q19'},
{id:'9708_s26_qp_12_Q20',type:'mcq',ch:'4.3',q:"The diagram shows the aggregate demand (AD) and aggregate supply (AS) curves for a country. The initial level of national income is given by Y1.\nWhat is the most likely new equilibrium point if there is increased productivity in the manufacture of goods produced for the domestic market?",o:["Point A", "Point B", "Point C", "Point D"],a:2,e:"Higher productivity shifts AS right, raising output and lowering the price level: the equilibrium moves to C.",src:'9708_s26_qp_12_Q20'},
{id:'9708_s26_qp_12_Q21',type:'mcq',ch:'5.4',q:"What is the main objective of supply-side policies?",o:["to bring a country’s potential output up to the level of its actual output", "to ensure a budget surplus", "to ensure that the composition of output matches the pattern of demand", "to increase potential output"],a:3,e:"Supply-side policy raises potential output rather than redistributing existing demand.",src:'9708_s26_qp_12_Q21'},
{id:'9708_s26_qp_12_Q22',type:'mcq',ch:'5.2',q:"A government reduced direct taxes on consumers and businesses.\nWhat are likely to be the effects of these changes on consumption, investment and national output?",o:["decrease decrease decrease", "decrease increase increase", "increase decrease decrease", "increase increase increase"],a:3,e:"Higher disposable income raises consumption, higher retained profit raises investment and both raise output.",src:'9708_s26_qp_12_Q22'},
{id:'9708_s26_qp_12_Q23',type:'mcq',ch:'5.2',q:"An economy has a GDP of $500 billion.The budget surplus is 2% of GDP.\nWhat is the government spending when the tax revenue is $80 billion?",o:["$60 billion", "$70 billion", "$80 billion", "$90 billion"],a:1,e:"The surplus is 2% of $500bn = $10bn, so spending is $80bn − $10bn = $70bn.",src:'9708_s26_qp_12_Q23'},
{id:'9708_s26_qp_12_Q24',type:'mcq',ch:'5.3',q:"Which action might be part of an expansionary economic policy?",o:["reducing the budget deficit", "reducing the level of government spending", "reducing the money supply", "reducing the rate of interest"],a:3,e:"A lower interest rate raises investment and consumption, so it is expansionary.",src:'9708_s26_qp_12_Q24'},
{id:'9708_s26_qp_12_Q25',type:'mcq',ch:'4.2',q:"What is not included in government spending (G) while calculating aggregate demand (AD)?",o:["education", "healthcare", "roads", "transfer payments"],a:3,e:"Transfer payments redistribute income; they do not buy goods, so they are excluded from G.",src:'9708_s26_qp_12_Q25'},
{id:'9708_s26_qp_12_Q26',type:'mcq',ch:'6.4',q:"The US dollar ($) has appreciated by 12% against an average of other major trading currencies.\nWhat is likely to have caused this?",o:["an increase in the US imports", "an increase in the US interest rate", "an increase in the US money supply", "an increase in the US employment rate"],a:1,e:"A higher US interest rate attracts capital, raising demand for dollars and appreciating it.",src:'9708_s26_qp_12_Q26'},
{id:'9708_s26_qp_12_Q27',type:'mcq',ch:'6.1',q:"What is the least likely outcome for participating countries of a move towards free trade?",o:["a greater product choice", "a more equal distribution of income", "greater international specialisation", "higher standards of living"],a:1,e:"Free trade is not expected to equalise incomes; gains are uneven across groups within countries.",src:'9708_s26_qp_12_Q27'},
{id:'9708_s26_qp_12_Q28',type:'mcq',ch:'6.2',q:"Which government measure would reduce protectionism?",o:["an increase in product safety standards", "an increase in subsidies to domestic firms", "an increase in the level of import quotas", "an increase in the rate of import duties"],a:2,e:"The mark scheme gives C. Note the wording is loose here: raising a quota is itself a barrier, and the other three options also restrict imports, so use this item only as practice on identifying trade barriers.",src:'9708_s26_qp_12_Q28'},
{id:'9708_s26_qp_12_Q29',type:'mcq',ch:'6.3',q:"Which policy will lead to a fall in the volume of goods imported?",o:["a cut in income tax rates", "a cut in interest rates", "an increase in import tariffs", "an increase in spending on training workers in domestic tourism"],a:2,e:"Higher import tariffs raise import prices, so import volume falls.",src:'9708_s26_qp_12_Q29'},
{id:'9708_s26_qp_12_Q30',type:'mcq',ch:'6.4',q:"In the diagram, D1 and S1 are the initial supply and demand curves of the pound sterling (£) on the foreign exchange markets.\nWhat will cause the demand curve to shift to D2 and the supply curve to S2?",o:["a decrease in the price levels of other countries", "a depreciation of the pound sterling", "a reduction in the level of UK import tariffs", "an increase in UK interest rates"],a:0,e:"Higher UK interest rates raise demand for sterling while the supply falls, because fewer pounds are sold for foreign assets.",src:'9708_s26_qp_12_Q30'},
{id:'9708_s26_qp_13_Q1',type:'mcq',ch:'1.1',q:"What are the basic questions of resource allocation?",o:["What to produce, how to produce and for whom to produce?", "What to produce, where to produce and for whom to produce?", "Where to produce, for whom to produce and how to produce?", "Where to produce, what to produce and how to produce?"],a:0,e:"Resource allocation answers what to produce, how to produce it and for whom it is produced.",src:'9708_s26_qp_13_Q1'},
{id:'9708_s26_qp_13_Q2',type:'mcq',ch:'2.1',q:"Which combination correctly identifies whether the three statements about inflation and unemployment are normative or positive?\n(1: the rate of inflation is measured using a price index; 2: a rise in unemployment is preferable to inflation; 3: the inflation rate of 9% in 2025 was the highest in 10 years)",o:["normative normative positive", "positive positive normative", "normative positive normative", "positive normative positive"],a:3,e:"Statement 2 is a judgement, so normative; 1 and 3 are testable facts, so positive. The row is normative, positive, positive.",src:'9708_s26_qp_13_Q2'},
{id:'9708_s26_qp_13_Q3',type:'mcq',ch:'1.5',q:"The diagram shows a production possibility curve (PPC) for capital goods and consumer goods.\nWhat is correct about the opportunity cost of one additional capital good?",o:["It is greater at X than Y.", "It is greater at Z than Y.", "It is the same at X, Y and Z.", "It is zero when 600 units of consumer goods are produced."],a:0,e:"The PPC is bowed out from the origin, so each extra unit of capital goods costs more consumer goods: opportunity cost is greater at X than at Y.",src:'9708_s26_qp_13_Q3'},
{id:'9708_s26_qp_13_Q4',type:'mcq',ch:'1.6',q:"What justifies government intervention in the provision of a merit good such as\neducation?",o:["People who pay for education value it more than those who cannot pay.", "Private schools have more merit than state schools.", "Costs of providing education outweigh benefits of education.", "Some consumers do not fully recognise the value of education."],a:3,e:"Merit goods are under-consumed because consumers do not recognise the full benefit, so the state must subsidise or provide them.",src:'9708_s26_qp_13_Q4'},
{id:'9708_s26_qp_13_Q5',type:'mcq',ch:'1.4',q:"What would most likely be considered an advantage by producers and a disadvantage\nby consumers of the operation of a planned economy?",o:["a bureaucratic system of decision-making", "a government emphasis on the production of capital goods", "a long response time to changing economic events", "an absence of financial incentives to work and to produce"],a:1,e:"Coordination failure and monitoring costs make central planning slow to respond to changing conditions.",src:'9708_s26_qp_13_Q5'},
{id:'9708_s26_qp_13_Q6',type:'mcq',ch:'2.1',q:"What would not affect the position of the demand curve for wigs?",o:["an increase in incomes", "a reduction in the price of hairdressing", "an increase in wigs worn by television celebrities", "a reduction in the price of wigs"],a:3,e:"A change in price moves along the demand curve; only wigs' own price rise reduces quantity demanded rather than shifting demand.",src:'9708_s26_qp_13_Q6'},
{id:'9708_s26_qp_13_Q7',type:'mcq',ch:'2.2',q:"The price elasticity of demand for a good is highly elastic.\nWhat is the impact on expenditure on this good when its price increases?",o:["decreases", "increases by a large amount", "increases by a small amount", "stays unchanged"],a:0,e:"With highly elastic demand, a small price rise causes a large fall in quantity demanded.",src:'9708_s26_qp_13_Q7'},
{id:'9708_s26_qp_13_Q8',type:'mcq',ch:'2.3',q:"For which supply curve is the value of price elasticity of supply not the same at all points\non\nthe curve?",o:["S1", "S2", "S3", "S4"],a:2,e:"Supply that does not respond at all to price has zero elasticity, PES = 0.",src:'9708_s26_qp_13_Q8'},
{id:'9708_s26_qp_13_Q9',type:'mcq',ch:'2.4',q:"The diagram shows two demand curves and two supply curves in the market for coffee beans. Coffee beans and tea are substitutes for consumers.\nWhat is the likely cause of the change in equilibrium from E1 to E2?",o:["a rise in the price of tea and an increase in the cost of producing coffee beans", "a subsidy on the production of coffee beans and an increase in the production of tea", "an increase in the number of coffee bean producers and a fall in the price of tea", "the removal of a subsidy for coffee bean producers and a fall in the price of tea"],a:3,e:"Lower coffee bean supply raises the price and reduces quantity traded.",src:'9708_s26_qp_13_Q9'},
{id:'9708_s26_qp_13_Q10',type:'mcq',ch:'3.3',q:"A government increases the import tariff on food products.\nWhat will be the impact on consumer surplus and price?",o:["falls falls", "falls rises", "rises falls", "rises rises"],a:1,e:"A tariff raises the domestic price, so consumer surplus falls, and the price rises.",src:'9708_s26_qp_13_Q10'},
{id:'9708_s26_qp_13_Q11',type:'mcq',ch:'4.1',q:"What would be included in a measure of wealth?",o:["interest received on savings held in bank accounts", "jewellery purchased by households", "profits gained from investments", "rent gained from ownership of property"],a:1,e:"Wealth is a stock of assets: savings balances, jewellery, investments and property, not income flows.",src:'9708_s26_qp_13_Q11'},
{id:'9708_s26_qp_13_Q12',type:'mcq',ch:'4.6',q:"What is the major problem associated with a government directly providing the correct\namount of a public good?",o:["competition from private producers", "estimation of demand", "increased trade", "rivalry in consumption"],a:1,e:"Direct provision removes the price signal, so consumers' demand is hard to estimate and surpluses or shortages appear.",src:'9708_s26_qp_13_Q12'},
{id:'9708_s26_qp_13_Q13',type:'mcq',ch:'4.5',q:"The Gini Coefficient of a country rises from 0.45 to 0.49.\nWhat is the most likely explanation of this increase in the Gini Coefficient?",o:["incomes are distributed more equally", "the taxation system has become more progressive", "low-income workers have acquired new skills", "there is a reduction in welfare payments"],a:3,e:"A higher Gini coefficient means greater inequality, which follows from cuts in welfare payments.",src:'9708_s26_qp_13_Q13'},
{id:'9708_s26_qp_13_Q14',type:'mcq',ch:'4.5',q:"The income tax structure of a country has two elements.\n1\nThe first $20000 of earned income is not taxed.\n2\nAny income earned above $20000 is taxed at 20%.\nWhat would be a correct description of this tax structure?",o:["It is a progressive tax structure.", "It is a proportional tax structure.", "It is a regressive tax structure.", "The average rate of taxation decreases as incomes increase."],a:0,e:"The first $2000 is tax free and the next $2000 is taxed at 20%, so the average rate rises with income: progressive.",src:'9708_s26_qp_13_Q14'},
{id:'9708_s26_qp_13_Q15',type:'mcq',ch:'3.3',q:"A government imposes a maximum price on a new vaccine below the market equilibrium\nprice.\nWhat will happen in the market as a result of this government intervention?",o:["companies will produce more new vaccines to meet the demand at the maximum price", "demand of the new vaccine will decrease at the maximum price", "some consumers will be unable to buy the new vaccine at the maximum price", "the market will clear at the maximum price"],a:2,e:"A maximum price below equilibrium creates excess demand, so some consumers cannot buy the vaccine.",src:'9708_s26_qp_13_Q15'},
{id:'9708_s26_qp_13_Q16',type:'mcq',ch:'4.1',q:"What is not included in the measurement of national income?",o:["benefits paid to the unemployed", "dividends paid to shareholders", "profits retained by companies", "rent paid to landlords"],a:0,e:"National income counts income earned in production; transfer payments and retained profits are not factor incomes to households.",src:'9708_s26_qp_13_Q16'},
{id:'9708_s26_qp_13_Q17',type:'mcq',ch:'4.2',q:"What represents a leakage from the circular flow of income in an economy?",o:["a balance of trade surplus", "a government budget surplus", "reduction in firm’s spending on research and development", "reinvestment of a firm’s profits"],a:1,e:"Savings are a leakage; exports, investment and government spending are injections.",src:'9708_s26_qp_13_Q17'},
{id:'9708_s26_qp_13_Q18',type:'mcq',ch:'4.1',q:"How is real GDP calculated?",o:["Formula A", "Formula B", "Formula C", "Formula D"],a:0,e:"Real GDP removes price changes: nominal GDP multiplied by the price index of the base year over the price index of the current year, times 100.",src:'9708_s26_qp_13_Q18'},
{id:'9708_s26_qp_13_Q19',type:'mcq',ch:'4.6',q:"Which combination is likely to result in cost-push inflation?",o:["falling falling", "falling rising", "rising falling", "rising rising"],a:0,e:"A falling exchange rate raises import costs and falling output per worker raises unit labour costs: both push costs up.",src:'9708_s26_qp_13_Q19'},
{id:'9708_s26_qp_13_Q20',type:'mcq',ch:'4.4',q:"What is most likely to lead to a situation where the recorded number of unemployed is\nmore than the actual number?",o:["Some workers are not provided with enough work to work at their full capacity.", "Some workers fail to register themselves for unemployment benefits.", "Some workers give up looking for work due to a lack of job opportunities.", "Some workers may claim to be unemployed to avoid paying income tax."],a:3,e:"Discouraged workers who stop looking are not counted, so the recorded unemployed can understate the true figure; claiming benefits to avoid tax overstates it.",src:'9708_s26_qp_13_Q20'},
{id:'9708_s26_qp_13_Q21',type:'mcq',ch:'1.6',q:"A government spends money providing healthcare to the population.\nWhy does the government do this?",o:["All healthcare is too expensive.", "Healthcare is non-excludable.", "Healthcare is non-rival.", "Healthcare is underconsumed."],a:3,e:"Healthcare is under-consumed when left to the market, which is the merit-good argument for public spending.",src:'9708_s26_qp_13_Q21'},
{id:'9708_s26_qp_13_Q22',type:'mcq',ch:'5.2',q:"What is not a tool of monetary policy?",o:["capital investment", "credit regulations", "interest rates", "money supply"],a:0,e:"Capital investment is a component of AD, not an instrument of monetary policy.",src:'9708_s26_qp_13_Q22'},
{id:'9708_s26_qp_13_Q23',type:'mcq',ch:'5.2',q:"The table shows real GDP and consumer prices (CPI) expressed as index numbers for an economy (2020 = 100).\nWhich combination of policies will achieve economic growth and low and stable inflation?",o:["decreases decreases", "decreases increases", "increases decreases", "increases increases"],a:2,e:"Real GDP is falling, so the budget deficit should increase and interest rates should fall to stimulate spending.",src:'9708_s26_qp_13_Q23'},
{id:'9708_s26_qp_13_Q24',type:'mcq',ch:'5.3',q:"In which situation is expansionary fiscal policy through increased government expenditure\nlikely to be most effective in increasing employment in an economy?",o:["When the AD curve cuts the horizontal part of the AS curve.", "When the AD curve cuts the vertical part of the AS curve.", "When the government also raises tax to fund its increased expenditure.", "When the government injects a large amount of spending into the economy."],a:0,e:"Expansionary fiscal policy works best when the economy has spare capacity, which is the horizontal section of the AS curve.",src:'9708_s26_qp_13_Q24'},
{id:'9708_s26_qp_13_Q25',type:'mcq',ch:'5.2',q:"The diagram shows the aggregate demand (AD) and aggregate supply (AS) curves for an economy. The AD curve is initially at AD1. The economy is experiencing a growth in exports which is expected to lead to an increase in the price level to P3. In consequence, the government adopts a contractionary monetary policy to reduce the price level to the lowest possible value without changing national income.\nWhich statement is correct?",o:["If there is no monetary policy the AD curve will move to AD2, but following the contractionary", "If there is no monetary policy the AD curve will move to AD2, but following the contractionary", "If there is no monetary policy the AD curve will move to AD3, but following the contractionary", "If there is no monetary policy the AD curve will move to AD3, but following the contractionary"],a:3,e:"Exports growth shifts AD to AD3; contractionary policy then pulls AD back to AD2, giving a lower price at the unchanged income Y1.",src:'9708_s26_qp_13_Q25'},
{id:'9708_s26_qp_13_Q26',type:'mcq',ch:'6.2',q:"What is not an example of protectionism?",o:["a ban on imports of chicken products", "import tariffs on agricultural products", "maximum supermarket food prices", "strict health and safety requirements for imported products"],a:2,e:"A maximum price on food is a domestic price control, not a barrier to imports.",src:'9708_s26_qp_13_Q26'},
{id:'9708_s26_qp_13_Q27',type:'mcq',ch:'6.3',q:"A family from the United States buys a holiday in Spain.\nWhat is the effect of this on the current account of the balance of payments in Spain?",o:["It improves the balance of trade in goods.", "It improves the balance of trade in services.", "It worsens the balance of trade in goods.", "It worsens the balance of trade in services."],a:1,e:"A US resident buying a Spanish holiday is an export of services for Spain, improving the services balance.",src:'9708_s26_qp_13_Q27'},
{id:'9708_s26_qp_13_Q28',type:'mcq',ch:'6.4',q:"How is the terms of trade index calculated?",o:["Formula A", "Formula B", "Formula C", "Formula D"],a:0,e:"The terms of trade index is the index of export prices divided by the index of import prices, times 100.",src:'9708_s26_qp_13_Q28'},
{id:'9708_s26_qp_13_Q29',type:'mcq',ch:'6.2',q:"What is not an argument for protectionist policies?",o:["to improve the current account of the balance of payments", "to improve the terms of trade", "to reduce the rate of domestic inflation", "to protect strategic industries"],a:2,e:"Protection raises domestic prices and so increases, rather than reduces, the rate of inflation.",src:'9708_s26_qp_13_Q29'},
{id:'9708_s26_qp_13_Q30',type:'mcq',ch:'6.4',q:"What is the consequence of an appreciation of the exchange rate on the current account of the balance of payments and on the price level?",o:["improves decreases", "improves increases", "worsens decreases", "worsens increases"],a:2,e:"An appreciation makes exports dearer and imports cheaper, worsening the current account while lowering the price level.",src:'9708_s26_qp_13_Q30'},
{id:'9708_s26_qp_14_Q1',type:'mcq',ch:'1.1',q:"Which statement describes the fundamental economic problem of scarcity?",o:["There are limited resources and unlimited wants.", "There are limited resources and limited wants.", "There are unlimited resources and limited wants.", "There are unlimited resources and unlimited wants."],a:0,e:"Scarcity means wants are unlimited but the resources to satisfy them are finite.",src:'9708_s26_qp_14_Q1'},
{id:'9708_s26_qp_14_Q2',type:'mcq',ch:'1.3',q:"Which combination correctly describes the characteristics of a free good?",o:["limited no", "limited yes", "unlimited no", "unlimited yes"],a:2,e:"A free good is available in unlimited supply at zero opportunity cost, so it need not be rationed.",src:'9708_s26_qp_14_Q2'},
{id:'9708_s26_qp_14_Q3',type:'mcq',ch:'3.1',q:"What is not a reward to a factor of production?",o:["interest", "rent", "tax", "wages"],a:2,e:"Tax is not a factor reward: interest, rent and wages are the returns to capital, land and labour.",src:'9708_s26_qp_14_Q3'},
{id:'9708_s26_qp_14_Q4',type:'mcq',ch:'1.5',q:"YX is an economy’s production possibility curve (PPC). The equation of the curve is qY = 1000 – 2qX.\nWhat is the opportunity cost of producing one extra unit of good X?",o:["1 unit of good Y", "2 units of good Y", "500 units of good Y", "1000 units of good Y"],a:1,e:"One more unit of X costs 2 units of Y, because the gradient of the line, –2, is the opportunity cost.",src:'9708_s26_qp_14_Q4'},
{id:'9708_s26_qp_14_Q5',type:'mcq',ch:'1.5',q:"The diagram shows production possibility curves for a farmer. The original position is X.\nIf the farmer switches some of his land from producing pears to producing apples, which point represents his new position?",o:["Point A", "Point B", "Point C", "Point D"],a:1,e:"Switching land from pears to apples moves the farmer along the curve towards more apples: point B.",src:'9708_s26_qp_14_Q5'},
{id:'9708_s26_qp_14_Q6',type:'mcq',ch:'2.3',q:"A good has a price elasticity of supply of 2.0. The current quantity supplied is 300 units per week\nat a market price of $20 per unit.\nThe firm raises the price to $25 per unit.\nWhat will the new quantity supplied be per week?",o:["150 units", "375 units", "400 units", "450 units"],a:3,e:"PES of 2.0 means a 25% price rise raises quantity supplied by 50%, from 300 to 450.",src:'9708_s26_qp_14_Q6'},
{id:'9708_s26_qp_14_Q7',type:'mcq',ch:'2.5',q:"What is producer surplus?",o:["The amount of the good left unsold when supply of a product exceeds demand for the product.", "The amount of goods purchased in a buffer stock scheme when prices are low.", "The difference between a point on a production possibility curve and a point inside it.", "The difference between the price a producer is willing to accept and the price that is"],a:3,e:"Producer surplus is the difference between the price received and the minimum price the producer would accept.",src:'9708_s26_qp_14_Q7'},
{id:'9708_s26_qp_14_Q8',type:'mcq',ch:'2.4',q:"The diagram represents the market for electric cookers.\nWhat is likely to explain the change in the equilibrium from point X to point Y?",o:["a fall in the price of electric cookers", "an increase in a specific tax on electric cookers", "an increase in the number of households", "an increase in the price of electricity"],a:2,e:"More households raise demand for cookers, shifting the demand curve right.",src:'9708_s26_qp_14_Q8'},
{id:'9708_s26_qp_14_Q9',type:'mcq',ch:'2.4',q:"A firm supplies a highly competitive market with mobile phones and the apps used with them.\nThe market price of mobile phones rises but the price charged for apps remains the same.\nWhat are the most likely consequences for expenditure on this firm’s mobile phones and apps?\nexpenditure",o:["falls falls", "rises falls", "falls unchanged", "rises unchanged"],a:0,e:"In a highly competitive market demand is elastic, so a price rise reduces spending on phones, and complementary app purchases fall too.",src:'9708_s26_qp_14_Q9'},
{id:'9708_s26_qp_14_Q10',type:'mcq',ch:'2.4',q:"The demand curve of a product is represented by the equation Qd = 80 −5P.\nThe supply curve of a product is represented by the equation Qs = 40 + 3P, where Qd = quantity\ndemanded, Qs = quantity supplied and P = price.\nWhat is the equilibrium price of the product?",o:["$5", "$8", "$15", "$20"],a:0,e:"Set Qd = Qs: 80 − 5P = 40 + 3P gives P = 5.",src:'9708_s26_qp_14_Q10'},
{id:'9708_s26_qp_14_Q11',type:'mcq',ch:'3.2',q:"A government has decided to provide a subsidy on a merit good which has a downward sloping\ndemand curve.\nWhat will always fall as a result?",o:["consumer expenditures", "government expenditures", "price of the product", "producer revenues"],a:2,e:"A subsidy shifts supply right, so the price paid by consumers always falls.",src:'9708_s26_qp_14_Q11'},
{id:'9708_s26_qp_14_Q12',type:'mcq',ch:'4.5',q:"What is used to measure inequalities in the distribution of income?",o:["the Gini coefficient", "the rate of income tax", "the rate of inflation", "the circular flow of income"],a:0,e:"The Gini coefficient is the standard summary measure of income inequality.",src:'9708_s26_qp_14_Q12'},
{id:'9708_s26_qp_14_Q13',type:'mcq',ch:'1.4',q:"Which scenario leads to the free rider problem?",o:["buy one get one free promotions leaving supermarket shelves empty", "free goods such as the sea being polluted by discarded plastics", "households who enjoy the benefits of defence without paying for it", "long queues for treatment caused by free medical care"],a:2,e:"Defence protects everyone whether or not they pay, so non-payers free ride on the spending of others.",src:'9708_s26_qp_14_Q13'},
{id:'9708_s26_qp_14_Q14',type:'mcq',ch:'5.3',q:"Increases to which measures are most likely to stabilise the price level and reduce income\ninequalities at the same time?",o:["import tariffs on non-essential items and transfer payments", "interest rates and restrictions on bank lending", "minimum wages and tax allowances", "tax rates on high income earners and subsidies for essential food items"],a:3,e:"Higher tax on high earners with subsidies on essentials both reduce inequality and steady prices.",src:'9708_s26_qp_14_Q14'},
{id:'9708_s26_qp_14_Q15',type:'mcq',ch:'5.3',q:"In the diagram, D is the demand curve of an agricultural commodity and S is the initial supply curve.\nThe government promises to maintain farmers’ incomes at least at their initial level. The harvests\nin four subsequent years are shown by supply curves S1–S4.\nquantity (000 tonnes)\nIn which years will the government not need to provide extra income to farmers?",o:["1 and 2", "1 and 4", "2 and 3", "3 and 4"],a:2,e:"The buffer stock scheme needs government money when harvests are low or prices are high.",src:'9708_s26_qp_14_Q15'},
{id:'9708_s26_qp_14_Q16',type:'mcq',ch:'4.4',q:"The use of new technology by firms has led to an increase in unemployment in an economy.\nWhat is this an example of?",o:["cyclical unemployment", "frictional unemployment", "seasonal unemployment", "structural unemployment"],a:3,e:"New technology changes the skills demanded, so workers lose jobs because their skills no longer match: structural unemployment.",src:'9708_s26_qp_14_Q16'},
{id:'9708_s26_qp_14_Q17',type:'mcq',ch:'4.6',q:"Which change in aggregate demand will increase demand−pull inflationary pressure in an economy?",o:["higher government spending", "higher import spending", "lower consumer spending", "lower investment spending"],a:0,e:"Higher government spending is an injection that shifts AD right and raises demand-pull inflationary pressure.",src:'9708_s26_qp_14_Q17'},
{id:'9708_s26_qp_14_Q18',type:'mcq',ch:'4.2',q:"Which row correctly identifies net injections into a country’s circular flow of income?",o:["no no yes", "no yes no", "yes no yes", "yes yes no"],a:2,e:"Injections exceed leakages when government spending, investment and exports are larger than taxation, savings and imports: row C.",src:'9708_s26_qp_14_Q18'},
{id:'9708_s26_qp_14_Q19',type:'mcq',ch:'4.1',q:"What is the most likely reason why the usefulness of a consumer price index (CPI) is limited when\nrecording changes in the price level?",o:["It does not take account of changes in the quality of goods and services.", "It is not possible to include enough prices of different goods and services.", "It only records consumption patterns for an average household.", "It does not consider all available goods and services."],a:0,e:"A CPI basket is fixed for a period, so it cannot reflect changes in quality or new products.",src:'9708_s26_qp_14_Q19'},
{id:'9708_s26_qp_14_Q20',type:'mcq',ch:'4.3',q:"The diagram shows an economy at full employment equilibrium.\nreal output\nWhich short-run measures should the government take to maintain the economy’s current equilibrium\nif there is an unexpected balance of trade surplus?",o:["higher government spending on education financed by an equal rise in direct taxation", "higher direct taxation with government spending unchanged to create a budget surplus", "higher spending on infrastructure financed by a budget deficit", "lower interest rates to promote investment spending in the private sector"],a:1,e:"A trade surplus adds to aggregate demand, so the government should withdraw demand by raising direct taxes.",src:'9708_s26_qp_14_Q20'},
{id:'9708_s26_qp_14_Q21',type:'mcq',ch:'5.2',q:"An economy is at a point within its production possibility curve (PPC).\nWhich monetary policy will help the government to achieve a macroeconomic objective of\nlower unemployment?",o:["an increase in credit regulations", "an increase in the exchange rate", "an increase in the interest rate", "an increase in the money supply"],a:3,e:"An economy inside its PPC has spare capacity, so expanding the money supply raises output and employment.",src:'9708_s26_qp_14_Q21'},
{id:'9708_s26_qp_14_Q22',type:'mcq',ch:'4.5',q:"What is a definition of a proportional tax?",o:["A tax which takes a larger percentage of income from those on high incomes.", "A tax which takes a larger amount of income from those on low incomes.", "A tax which takes the same amount of income from all income groups.", "A tax which takes the same percentage of income from all income groups."],a:3,e:"A proportional tax takes the same percentage of income from everyone.",src:'9708_s26_qp_14_Q22'},
{id:'9708_s26_qp_14_Q23',type:'mcq',ch:'5.2',q:"The central bank of a country has increased interest rates to a high level.\nWhat will increase as a result of this?",o:["cost of borrowing", "economic growth", "employment", "price level"],a:0,e:"Higher interest rates raise the cost of borrowing and reduce investment and consumption.",src:'9708_s26_qp_14_Q23'},
{id:'9708_s26_qp_14_Q24',type:'mcq',ch:'5.3',q:"The diagram shows the aggregate demand (AD) and aggregate supply (AS) curves for a country.\nWhat is the impact on the price level and unemployment of a small decrease in\ngovernment expenditure?",o:["decrease decrease", "decrease unchanged", "increase unchanged", "unchanged increase"],a:1,e:"Lower government spending reduces aggregate demand, so the price level falls, with unemployment broadly unchanged.",src:'9708_s26_qp_14_Q24'},
{id:'9708_s26_qp_14_Q25',type:'mcq',ch:'5.4',q:"A newly-built public sector engineering training college received poor inspection reports. The\ngovernment ceased to pay the college the money that it had usually received as its annual grant.\nWhich types of government policy does this statement imply?",o:["fiscal and monetary policies only", "fiscal and supply-side policies only", "fiscal, monetary and supply-side policies", "monetary and supply-side policies only"],a:1,e:"The training college is physical capital, so fiscal support plus supply-side measures best raise output.",src:'9708_s26_qp_14_Q25'},
{id:'9708_s26_qp_14_Q26',type:'mcq',ch:'6.2',q:"Which action increases and which action decreases the level of protectionism?",o:["imposing an embargo reducing subsidies to", "imposing exchange controls lowering quota levels", "introducing voluntary increasing subsidies to", "removing quotas introducing embargos"],a:0,e:"An embargo bans trade and so increases protection most directly.",src:'9708_s26_qp_14_Q26'},
{id:'9708_s26_qp_14_Q27',type:'mcq',ch:'6.3',q:"Which policy is not likely to help reduce a current account deficit on the balance of payments?",o:["an increase in expenditure promoting locally produced goods", "an increase in the quota on cheap imports", "an increase in the restrictions on foreign exchange", "an increase in the subsidies to exporting industries"],a:1,e:"A larger quota on cheap imports raises import volumes and makes the deficit worse.",src:'9708_s26_qp_14_Q27'},
{id:'9708_s26_qp_14_Q28',type:'mcq',ch:'6.1',q:"The principle of comparative advantage states that a country can make gains in international trade.\nWhat are these gains determined by?",o:["the country being willing to impose tariffs on its trading partners", "the country having a lower opportunity cost in the production of some goods compared", "the country’s capacity to export the goods it produces", "the country’s total productive capacity"],a:1,e:"Gains from trade depend on each country specialising where its opportunity cost is lower.",src:'9708_s26_qp_14_Q28'},
{id:'9708_s26_qp_14_Q29',type:'mcq',ch:'6.4',q:"There is a floating exchange rate between country M and country N.\nWhich changes will definitely cause an appreciation of country M’s currency?",o:["decreases decreases", "decreases increases", "increases decreases", "increases increases"],a:2,e:"An appreciation needs export earnings to rise and import spending to fall: export values increase, import values decrease.",src:'9708_s26_qp_14_Q29'},
{id:'9708_s26_qp_14_Q30',type:'mcq',ch:'6.4',q:"The slowdown of global economic activity has not only decreased the demand for various goods and services, but also decreased oil prices.\nWhat is the most likely effect on a country that relies heavily on imports of oil and foreign remittances from workers?",o:["falls improves", "falls uncertain", "rises improves", "rises uncertain"],a:1,e:"Cheaper oil reduces the import bill, improving the current account, while the effect on prices is uncertain because lower remittances cut demand.",src:'9708_s26_qp_14_Q30'}

/* ===== Built-in bank · flashcards (English) ===== */
const BUILTIN_CARD = [
{id:'c01',type:'card',ch:'1.1',t:'Definition',front:'Scarcity',back:'The situation in which wants are unlimited but the resources available to satisfy them are limited, so choices must be made.',note:'Relative concept; not the same as a temporary shortage.'},
{id:'c02',type:'card',ch:'1.1',t:'Definition',front:'Opportunity cost',back:'The value of the next best alternative forgone when a choice is made.',note:'Only the next best alternative; sunk costs are excluded.'},
{id:'c03',type:'card',ch:'1.1',t:'Definition',front:'Sunk cost',back:'A cost already incurred that cannot be recovered and therefore should not affect current decisions.',note:'Use it to explain why tuition fees are excluded.'},
{id:'c04',type:'card',ch:'1.2',t:'Definition',front:'Ceteris paribus',back:'A modelling assumption that all other variables are held constant so that the effect of one variable can be isolated.',note:'Limits the scope of a model conclusion.'},
{id:'c05',type:'card',ch:'1.2',t:'Definition',front:'Normative statement',back:'A statement containing a value judgement about what ought to be, which cannot be tested with data.',note:'Signals: should, ought, fair, better.'},
{id:'c06',type:'card',ch:'1.2',t:'Definition',front:'Positive statement',back:'A statement about what is, which can be tested against evidence.',note:'Can be confirmed or refuted by data.'},
{id:'c07',type:'card',ch:'1.3',t:'Definition',front:'Factors of production',back:'Land, labour, capital and enterprise, the inputs used to produce goods and services.',note:'Rewards: rent, wages, interest, profit.'},
{id:'c08',type:'card',ch:'1.3',t:'Definition',front:'Human capital',back:'The skills, knowledge and health of workers that raise their productivity, created mainly by education and training.',note:'A quality of labour.'},
{id:'c09',type:'card',ch:'1.3',t:'Definition',front:'Division of labour',back:'Breaking production into specialised tasks carried out by different workers in order to raise output per worker.',note:'Raises efficiency but increases dependence and monotony.'},
{id:'c10',type:'card',ch:'1.4',t:'Definition',front:'Price mechanism',back:'The system by which prices signal scarcity, ration scarce goods and provide incentives to producers and consumers.',note:'Three functions: signalling, rationing, incentive.'},
{id:'c11',type:'card',ch:'1.4',t:'Definition',front:'Mixed economy',back:'An economy in which resources are allocated partly by the market and partly by government.',note:'Most real economies are mixed.'},
{id:'c12',type:'card',ch:'1.5',t:'Definition',front:'Production possibility curve',back:'A curve showing the maximum combinations of two goods an economy can produce when all resources are fully and efficiently employed.',note:'Inside the curve means unused resources; outside is currently impossible.'},
{id:'c13',type:'card',ch:'1.5',t:'Definition',front:'Opportunity cost on a PPC',back:'The amount of one good that must be given up to produce one more unit of the other good, shown by the slope of the curve.',note:'A concave shape means increasing opportunity cost.'},
{id:'c14',type:'card',ch:'1.6',t:'Definition',front:'Public good',back:'A good that is non-rival and non-excludable, so the free market under-provides it.',note:'Examples: defence, street lighting, flood control.'},
{id:'c15',type:'card',ch:'1.6',t:'Definition',front:'Merit good',back:'A good whose benefits consumers underestimate or which creates positive externalities, so it is under-consumed in a free market.',note:'Examples: education, vaccines; corrected by subsidy or compulsion.'},
{id:'c16',type:'card',ch:'1.6',t:'Definition',front:'Demerit good',back:'A good whose costs consumers underestimate or which creates negative externalities, so it is over-consumed in a free market.',note:'Examples: tobacco, sugary drinks; corrected by tax or regulation.'},
{id:'c17',type:'card',ch:'1.6',t:'Definition',front:'Free rider',back:'A person who consumes a good without paying for it because the good is non-excludable.',note:'The direct cause of under-provision of public goods.'},
{id:'c18',type:'card',ch:'2.1',t:'Definition',front:'Effective demand',back:'The willingness and ability to buy a given quantity at a given price at a given time.',note:'Willingness alone is not demand.'},
{id:'c19',type:'card',ch:'2.1',t:'Definition',front:'Joint supply',back:'A situation in which the production of one good automatically produces another good as a by-product.',note:'Beef and leather.'},
{id:'c20',type:'card',ch:'2.2',t:'Definition',front:'PED',back:'The percentage change in quantity demanded divided by the percentage change in price; usually negative.',note:'|PED| above 1 is elastic; 0 is perfectly inelastic.'},
{id:'c21',type:'card',ch:'2.2',t:'Definition',front:'YED',back:'The percentage change in quantity demanded divided by the percentage change in income.',note:'Positive normal (above 1 luxury); negative inferior.'},
{id:'c22',type:'card',ch:'2.2',t:'Definition',front:'XED',back:'The percentage change in quantity demanded of good A divided by the percentage change in the price of good B.',note:'Positive substitutes; negative complements.'},
{id:'c23',type:'card',ch:'2.3',t:'Definition',front:'PES',back:'The percentage change in quantity supplied divided by the percentage change in price.',note:'Time is the key determinant.'},
{id:'c24',type:'card',ch:'2.4',t:'Definition',front:'Equilibrium price',back:'The price at which quantity demanded equals quantity supplied, so there is no tendency for price to change.',note:'A shortage pushes price up; a surplus pushes it down.'},
{id:'c25',type:'card',ch:'2.5',t:'Definition',front:'Consumer surplus',back:'The difference between the total amount consumers are willing to pay and the amount they actually pay.',note:'Area below demand and above price.'},
{id:'c26',type:'card',ch:'2.5',t:'Definition',front:'Producer surplus',back:'The difference between the price producers receive and the minimum price they would accept.',note:'Area above supply and below price.'},
{id:'c27',type:'card',ch:'3.1',t:'Definition',front:'Market failure',back:'A situation in which the free market allocates resources inefficiently, so social welfare is not maximised.',note:'Externalities, public goods, information failure, monopoly, inequality.'},
{id:'c28',type:'card',ch:'3.1',t:'Definition',front:'Government failure',back:'A situation in which government intervention worsens resource allocation and reduces welfare.',note:'Poor information, distorted incentives, rent-seeking, enforcement costs.'},
{id:'c29',type:'card',ch:'3.2',t:'Definition',front:'Specific tax',back:'A fixed amount of tax charged per unit sold, which shifts the supply curve upwards by that amount.',note:'The tax per unit is constant.'},
{id:'c30',type:'card',ch:'3.2',t:'Definition',front:'Ad valorem tax',back:'A tax charged as a percentage of the price, so the tax paid rises as price rises.',note:'The supply curve pivots rather than shifts.'},
{id:'c31',type:'card',ch:'3.2',t:'Definition',front:'Tax incidence',back:'The division of the burden of a tax between consumers and producers, determined by the relative elasticities of demand and supply.',note:'The less elastic side bears more; at the limit one side bears all.'},
{id:'c32',type:'card',ch:'3.2',t:'Definition',front:'Maximum price',back:'A legal ceiling on price set below equilibrium, which creates a shortage and requires non-price rationing.',note:'Black markets, queues, quality cuts.'},
{id:'c33',type:'card',ch:'3.2',t:'Definition',front:'Minimum price',back:'A legal floor on price set above equilibrium, which creates a surplus that may need government purchase or storage.',note:'Example: guaranteed prices for farmers.'},
{id:'c34',type:'card',ch:'3.3',t:'Definition',front:'Income',back:'A flow of money received over a period of time from wages, rent, interest, profit or transfers.',note:'A flow concept.'},
{id:'c35',type:'card',ch:'3.3',t:'Definition',front:'Wealth',back:'A stock of accumulated assets owned at a particular point in time.',note:'A stock, including property and financial assets.'},
{id:'c36',type:'card',ch:'3.3',t:'Definition',front:'Gini coefficient',back:'A measure of income inequality ranging from 0 (perfect equality) to 1 (perfect inequality), derived from the Lorenz curve.',note:'A higher value means more inequality.'},
{id:'c37',type:'card',ch:'4.1',t:'Definition',front:'GDP',back:'The total market value of final goods and services produced within a country in a given period.',note:'Domestic principle; excludes intermediate goods and transfers.'},
{id:'c38',type:'card',ch:'4.1',t:'Definition',front:'GNI',back:'GDP plus net factor income from abroad.',note:'Residence principle.'},
{id:'c39',type:'card',ch:'4.1',t:'Definition',front:'Real GDP',back:'GDP measured at constant prices, having removed the effect of inflation.',note:'Nominal GDP uses current prices.'},
{id:'c40',type:'card',ch:'4.1',t:'Definition',front:'GDP deflator',back:'A price index covering all domestically produced output, used to convert nominal GDP into real GDP.',note:'Broader coverage than the CPI.'},
{id:'c41',type:'card',ch:'4.2',t:'Definition',front:'Injections',back:'Spending that enters the circular flow from outside households: investment, government expenditure and exports.',note:'I + G + X.'},
{id:'c42',type:'card',ch:'4.2',t:'Definition',front:'Leakages',back:'Income that leaves the circular flow before it is spent on domestic output: saving, taxation and imports.',note:'S + T + M.'},
{id:'c43',type:'card',ch:'4.2',t:'Definition',front:'Multiplier',back:'The number of times an initial change in spending is amplified into a larger change in national income.',note:'1/(1−MPC), or 1/(MPS+MPT+MPM).'},
{id:'c44',type:'card',ch:'4.3',t:'Definition',front:'Aggregate demand',back:'Total planned spending on goods and services at a given price level: C + I + G + (X − M).',note:'A fall in the price level moves along the AD curve.'},
{id:'c45',type:'card',ch:'4.3',t:'Definition',front:'SRAS',back:'The relationship between output and the price level when at least one factor cost, usually wages, is fixed.',note:'Rising costs shift it left, giving stagflation.'},
{id:'c46',type:'card',ch:'4.3',t:'Definition',front:'LRAS',back:'The maximum output an economy can produce when all factors of production are fully employed; vertical in the neo-classical model.',note:'A rightward shift is potential growth.'},
{id:'c47',type:'card',ch:'4.4',t:'Definition',front:'Output gap',back:'The difference between actual output and potential output, expressed as a percentage of potential output.',note:'Negative gap is spare capacity; positive gap is overheating.'},
{id:'c48',type:'card',ch:'4.4',t:'Definition',front:'Economic growth',back:'An increase in real GDP over time; short-run growth uses spare capacity while long-run growth requires LRAS to shift right.',note:'Growth is not the same as development.'},
{id:'c49',type:'card',ch:'4.5',t:'Definition',front:'Structural unemployment',back:'Unemployment caused by a mismatch between the skills or location of workers and the requirements of available jobs.',note:'Caused by structural change in industry or technology.'},
{id:'c50',type:'card',ch:'4.5',t:'Definition',front:'Full employment',back:'The level of employment at which only frictional and seasonal unemployment remain.',note:'Not zero unemployment.'},
{id:'c51',type:'card',ch:'4.6',t:'Definition',front:'Inflation',back:'A sustained rise in the general price level which reduces the purchasing power of money.',note:'Distinguish from a one-off price rise.'},
{id:'c52',type:'card',ch:'4.6',t:'Definition',front:'CPI',back:'A weighted index of the prices of a representative basket of consumer goods, compared with a base year.',note:'Weights need updating; substitution bias.'},
{id:'c53',type:'card',ch:'4.6',t:'Definition',front:'Demand-pull inflation',back:'Inflation caused by aggregate demand growing faster than the capacity of the economy to produce.',note:'AD shifts right; output and prices rise together.'},
{id:'c54',type:'card',ch:'4.6',t:'Definition',front:'Cost-push inflation',back:'Inflation caused by rising costs of production, which shifts SRAS to the left.',note:'Output falls while prices rise: stagflation.'},
{id:'c55',type:'card',ch:'5.2',t:'Definition',front:'Fiscal policy',back:'The use of government spending and taxation to influence aggregate demand and the level of economic activity.',note:'Expansionary: spend more, tax less. Contractionary: the reverse.'},
{id:'c56',type:'card',ch:'5.2',t:'Definition',front:'Automatic stabiliser',back:'A feature such as progressive taxation or unemployment benefit that dampens fluctuations without any new policy decision.',note:'Taxes rise automatically in a boom; benefits rise in a slump.'},
{id:'c57',type:'card',ch:'5.2',t:'Definition',front:'Crowding out',back:'A situation where government borrowing raises interest rates and so reduces private sector investment.',note:'Weakens the effect of expansionary fiscal policy.'},
{id:'c58',type:'card',ch:'5.3',t:'Definition',front:'Monetary policy',back:'The use of interest rates, the money supply and exchange rate tools by the central bank to influence inflation and demand.',note:'Transmission: interest rate → borrowing → spending → AD.'},
{id:'c59',type:'card',ch:'5.3',t:'Definition',front:'Quantitative easing',back:'Central bank purchases of financial assets to inject money into the economy and lower long-term interest rates.',note:'Used when interest rates are near zero.'},
{id:'c60',type:'card',ch:'5.4',t:'Definition',front:'Supply-side policy',back:'Policies that increase the productive capacity of the economy, such as education, infrastructure, deregulation and tax reform.',note:'Market-based versus interventionist.'},
{id:'c61',type:'card',ch:'6.1',t:'Definition',front:'Comparative advantage',back:'A country has a comparative advantage in a good when it can produce it at a lower opportunity cost than a trading partner.',note:'Drives specialisation, not absolute efficiency.'},
{id:'c62',type:'card',ch:'6.1',t:'Definition',front:'Absolute advantage',back:'The ability to produce more output with the same resources, or the same output with fewer resources, than a trading partner.',note:'Absolute advantage alone does not explain the gains from trade.'},
{id:'c63',type:'card',ch:'6.2',t:'Definition',front:'Tariff',back:'A tax on imported goods which raises their domestic price and protects domestic producers.',note:'Raises revenue; consumers lose.'},
{id:'c64',type:'card',ch:'6.2',t:'Definition',front:'Quota',back:'A physical limit on the quantity of a good that may be imported in a period.',note:'Rent goes to licence holders and invites rent-seeking.'},
{id:'c65',type:'card',ch:'6.3',t:'Definition',front:'Current account',back:'The record of trade in goods and services, primary income and current transfers between residents and the rest of the world.',note:'Excludes financial account flows.'},
{id:'c66',type:'card',ch:'6.4',t:'Definition',front:'Depreciation',back:'A fall in the value of a currency in a floating exchange rate system caused by market forces.',note:'Distinguish from devaluation under a fixed rate.'},
{id:'c67',type:'card',ch:'6.5',t:'Definition',front:'Expenditure-switching policy',back:'Policies such as devaluation or tariffs that switch domestic spending from imports towards home-produced goods.',note:'Contrast with expenditure-reducing policies.'}
];
